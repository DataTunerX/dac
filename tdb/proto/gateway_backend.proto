syntax = "proto3";

package tdb.gateway.backend.v1;

service GatewayBackend {
  rpc SearchQuery(SearchQueryRequest) returns (SearchQueryResponse);
  rpc UpsertDomainStreamBinding(UpsertDomainStreamBindingRequest) returns (UpsertDomainStreamBindingResponse);
  rpc ListDomainStreamBindings(ListDomainStreamBindingsRequest) returns (ListDomainStreamBindingsResponse);
  rpc IndexEvent(IndexEventRequest) returns (IndexEventResponse);
  rpc AppendEvent(AppendEventRequest) returns (AppendEventResponse);
  rpc GetEvents(GetEventsRequest) returns (GetEventsResponse);
  rpc GetEventSentences(GetEventSentencesRequest) returns (GetEventSentencesResponse);
  rpc UpsertProperty(UpsertPropertyRequest) returns (UpsertPropertyResponse);
  rpc GetPropertyAsOf(GetPropertyAsOfRequest) returns (GetPropertyAsOfResponse);
  rpc UpsertEdge(UpsertEdgeRequest) returns (UpsertEdgeResponse);
  rpc GetEdgesAsOf(GetEdgesAsOfRequest) returns (GetEdgesAsOfResponse);
  rpc ListPropertyRows(ListPropertyRowsRequest) returns (ListPropertyRowsResponse);
  rpc UpsertEntity(UpsertEntityRequest) returns (UpsertEntityResponse);
  rpc GetEntity(GetEntityRequest) returns (GetEntityResponse);
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);
  rpc WriteSnapshot(WriteSnapshotRequest) returns (WriteSnapshotResponse);
  rpc GetLatestSnapshot(GetLatestSnapshotRequest) returns (GetLatestSnapshotResponse);
  rpc CreateArtifact(CreateArtifactRequest) returns (CreateArtifactResponse);
  rpc CreateArtifactVersion(CreateArtifactVersionRequest) returns (CreateArtifactVersionResponse);
  rpc GetArtifactVersionAsOf(GetArtifactVersionAsOfRequest) returns (GetArtifactVersionAsOfResponse);
  rpc GetArtifactVersionById(GetArtifactVersionByIdRequest) returns (GetArtifactVersionByIdResponse);
  rpc UpsertDecision(UpsertDecisionRequest) returns (UpsertDecisionResponse);
  rpc InsertDecisionEvidence(InsertDecisionEvidenceRequest) returns (InsertDecisionEvidenceResponse);
  rpc FindDecision(FindDecisionRequest) returns (FindDecisionResponse);
  rpc ListDecisionEvidence(ListDecisionEvidenceRequest) returns (ListDecisionEvidenceResponse);
  rpc UpsertAssertion(UpsertAssertionRequest) returns (UpsertAssertionResponse);
  rpc GetAssertion(GetAssertionRequest) returns (GetAssertionResponse);
  rpc SearchAssertions(SearchAssertionsRequest) returns (SearchAssertionsResponse);
  rpc UpsertEvidence(UpsertEvidenceRequest) returns (UpsertEvidenceResponse);
  rpc GetEvidence(GetEvidenceRequest) returns (GetEvidenceResponse);
  rpc SearchEvidence(SearchEvidenceRequest) returns (SearchEvidenceResponse);
  rpc UpsertEvidenceLocator(UpsertEvidenceLocatorRequest) returns (UpsertEvidenceLocatorResponse);
  rpc ListEvidenceLocators(ListEvidenceLocatorsRequest) returns (ListEvidenceLocatorsResponse);
  rpc UpsertEvidenceDerivation(UpsertEvidenceDerivationRequest) returns (UpsertEvidenceDerivationResponse);
  rpc ListEvidenceDerivations(ListEvidenceDerivationsRequest) returns (ListEvidenceDerivationsResponse);
  rpc UpsertEvidenceClassification(UpsertEvidenceClassificationRequest) returns (UpsertEvidenceClassificationResponse);
  rpc GetEvidenceClassification(GetEvidenceClassificationRequest) returns (GetEvidenceClassificationResponse);
  rpc UpsertAssertionEvidenceLink(UpsertAssertionEvidenceLinkRequest) returns (UpsertAssertionEvidenceLinkResponse);
  rpc ListAssertionEvidenceLinks(ListAssertionEvidenceLinksRequest) returns (ListAssertionEvidenceLinksResponse);
  rpc UpsertAssertionRelation(UpsertAssertionRelationRequest) returns (UpsertAssertionRelationResponse);
  rpc ListAssertionRelations(ListAssertionRelationsRequest) returns (ListAssertionRelationsResponse);
  rpc InsertMemoryDecision(InsertMemoryDecisionRequest) returns (InsertMemoryDecisionResponse);
  rpc ListRecentMemoryDecisions(ListRecentMemoryDecisionsRequest) returns (ListRecentMemoryDecisionsResponse);
  rpc InsertMemoryEpisodeSummary(InsertMemoryEpisodeSummaryRequest) returns (InsertMemoryEpisodeSummaryResponse);
  rpc ListRecentMemoryEpisodeSummaries(ListRecentMemoryEpisodeSummariesRequest) returns (ListRecentMemoryEpisodeSummariesResponse);
  rpc InsertMemoryAnswerArtifact(InsertMemoryAnswerArtifactRequest) returns (InsertMemoryAnswerArtifactResponse);
  rpc RecallMemoryAnswerArtifacts(RecallMemoryAnswerArtifactsRequest) returns (RecallMemoryAnswerArtifactsResponse);
  rpc InsertMemoryAnswerValidation(InsertMemoryAnswerValidationRequest) returns (InsertMemoryAnswerValidationResponse);

  // Ontology Catalog / Graph
  rpc UpsertOntologyConcept(UpsertOntologyConceptRequest) returns (UpsertOntologyConceptResponse);
  rpc GetOntologyConcept(GetOntologyConceptRequest) returns (GetOntologyConceptResponse);
  rpc ListOntologyConcepts(ListOntologyConceptsRequest) returns (ListOntologyConceptsResponse);
  rpc UpsertConceptAlias(UpsertConceptAliasRequest) returns (UpsertConceptAliasResponse);
  rpc ListConceptAliases(ListConceptAliasesRequest) returns (ListConceptAliasesResponse);
  rpc UpsertOntologyEdge(UpsertOntologyEdgeRequest) returns (UpsertOntologyEdgeResponse);
  rpc ListOntologyEdges(ListOntologyEdgesRequest) returns (ListOntologyEdgesResponse);
  rpc UpsertEventConceptLink(UpsertEventConceptLinkRequest) returns (UpsertEventConceptLinkResponse);
  rpc ListEventConceptLinks(ListEventConceptLinksRequest) returns (ListEventConceptLinksResponse);
  rpc UpsertOntologyObjectType(UpsertOntologyObjectTypeRequest) returns (UpsertOntologyObjectTypeResponse);
  rpc GetOntologyObjectType(GetOntologyObjectTypeRequest) returns (GetOntologyObjectTypeResponse);
  rpc ListOntologyObjectTypes(ListOntologyObjectTypesRequest) returns (ListOntologyObjectTypesResponse);
  rpc UpsertOntologyConceptTypeAssignment(UpsertOntologyConceptTypeAssignmentRequest) returns (UpsertOntologyConceptTypeAssignmentResponse);
  rpc ListOntologyConceptTypeAssignments(ListOntologyConceptTypeAssignmentsRequest) returns (ListOntologyConceptTypeAssignmentsResponse);
  rpc UpsertOntologyRelationType(UpsertOntologyRelationTypeRequest) returns (UpsertOntologyRelationTypeResponse);
  rpc GetOntologyRelationType(GetOntologyRelationTypeRequest) returns (GetOntologyRelationTypeResponse);
  rpc ListOntologyRelationTypes(ListOntologyRelationTypesRequest) returns (ListOntologyRelationTypesResponse);
  rpc ListOntologyFacts(ListOntologyFactsRequest) returns (ListOntologyFactsResponse);
  rpc UpsertOntologyFactWithEvidence(UpsertOntologyFactWithEvidenceRequest) returns (UpsertOntologyFactWithEvidenceResponse);
  rpc UpsertSemanticBatch(UpsertSemanticBatchRequest) returns (UpsertSemanticBatchResponse);
  rpc GetSemanticStatement(GetSemanticStatementRequest) returns (GetSemanticStatementResponse);
  rpc ListSemanticStatements(ListSemanticStatementsRequest) returns (ListSemanticStatementsResponse);
  rpc SetSemanticStatementStatus(SetSemanticStatementStatusRequest) returns (SetSemanticStatementStatusResponse);
  rpc GetSemanticStatementProvenance(GetSemanticStatementProvenanceRequest) returns (GetSemanticStatementProvenanceResponse);
  rpc GetSemanticStatementsByEvidence(GetSemanticStatementsByEvidenceRequest) returns (GetSemanticStatementsByEvidenceResponse);
  rpc SearchOntologyConcepts(SearchOntologyConceptsRequest) returns (SearchOntologyConceptsResponse);
  rpc SearchConceptAliases(SearchConceptAliasesRequest) returns (SearchConceptAliasesResponse);
  rpc SearchOntologyFacts(SearchOntologyFactsRequest) returns (SearchOntologyFactsResponse);
  rpc GetOntologyConceptNeighbors(GetOntologyConceptNeighborsRequest) returns (GetOntologyConceptNeighborsResponse);
  rpc ArchiveOntologyFact(ArchiveOntologyFactRequest) returns (ArchiveOntologyFactResponse);
  rpc UpsertTermMappingRegistry(UpsertTermMappingRegistryRequest) returns (UpsertTermMappingRegistryResponse);
  rpc GetTermMappingRegistry(GetTermMappingRegistryRequest) returns (GetTermMappingRegistryResponse);
  rpc ListTermMappingRegistries(ListTermMappingRegistriesRequest) returns (ListTermMappingRegistriesResponse);
  rpc UpsertTermMappingRule(UpsertTermMappingRuleRequest) returns (UpsertTermMappingRuleResponse);
  rpc GetTermMappingRule(GetTermMappingRuleRequest) returns (GetTermMappingRuleResponse);
  rpc SearchTermMappingRules(SearchTermMappingRulesRequest) returns (SearchTermMappingRulesResponse);
  rpc UpsertTermMappingRuleEvidence(UpsertTermMappingRuleEvidenceRequest) returns (UpsertTermMappingRuleEvidenceResponse);
  rpc ListTermMappingRuleEvidence(ListTermMappingRuleEvidenceRequest) returns (ListTermMappingRuleEvidenceResponse);
  rpc InterpretTerm(InterpretTermRequest) returns (InterpretTermResponse);
  rpc InterpretTermBatch(InterpretTermBatchRequest) returns (InterpretTermBatchResponse);
  rpc UpsertOntologyRawTerm(UpsertOntologyRawTermRequest) returns (UpsertOntologyRawTermResponse);
  rpc GetOntologyRawTerm(GetOntologyRawTermRequest) returns (GetOntologyRawTermResponse);
  rpc SearchOntologyRawTerms(SearchOntologyRawTermsRequest) returns (SearchOntologyRawTermsResponse);
  rpc UpsertOntologyRawTermCandidate(UpsertOntologyRawTermCandidateRequest) returns (UpsertOntologyRawTermCandidateResponse);
  rpc ListOntologyRawTermCandidates(ListOntologyRawTermCandidatesRequest) returns (ListOntologyRawTermCandidatesResponse);
  rpc UpsertOntologyNormalizedTerm(UpsertOntologyNormalizedTermRequest) returns (UpsertOntologyNormalizedTermResponse);
  rpc GetOntologyNormalizedTerm(GetOntologyNormalizedTermRequest) returns (GetOntologyNormalizedTermResponse);
  rpc SearchOntologyNormalizedTerms(SearchOntologyNormalizedTermsRequest) returns (SearchOntologyNormalizedTermsResponse);
  rpc UpsertOntologyTermCluster(UpsertOntologyTermClusterRequest) returns (UpsertOntologyTermClusterResponse);
  rpc GetOntologyTermCluster(GetOntologyTermClusterRequest) returns (GetOntologyTermClusterResponse);
  rpc ListOntologyTermClusters(ListOntologyTermClustersRequest) returns (ListOntologyTermClustersResponse);
  rpc UpsertOntologyClusterMember(UpsertOntologyClusterMemberRequest) returns (UpsertOntologyClusterMemberResponse);
  rpc ListOntologyClusterMembers(ListOntologyClusterMembersRequest) returns (ListOntologyClusterMembersResponse);
  rpc UpsertOntologyRelationCandidate(UpsertOntologyRelationCandidateRequest) returns (UpsertOntologyRelationCandidateResponse);
  rpc ListOntologyRelationCandidates(ListOntologyRelationCandidatesRequest) returns (ListOntologyRelationCandidatesResponse);
  rpc UpsertOntologyRawTermNormalization(UpsertOntologyRawTermNormalizationRequest) returns (UpsertOntologyRawTermNormalizationResponse);
  rpc ListOntologyRawTermNormalizations(ListOntologyRawTermNormalizationsRequest) returns (ListOntologyRawTermNormalizationsResponse);

  // Governance
  rpc UpsertRule(UpsertRuleRequest) returns (UpsertRuleResponse);
  rpc InsertAuthorityGrant(InsertAuthorityGrantRequest) returns (InsertAuthorityGrantResponse);
  rpc InsertRuleOverride(InsertRuleOverrideRequest) returns (InsertRuleOverrideResponse);
  rpc FindAuthorityAsOf(FindAuthorityAsOfRequest) returns (FindAuthorityAsOfResponse);
  rpc ListRuleOverridesAsOf(ListRuleOverridesAsOfRequest) returns (ListRuleOverridesAsOfResponse);
  rpc UpsertMethodologyFramework(UpsertMethodologyFrameworkRequest) returns (UpsertMethodologyFrameworkResponse);
  rpc GetMethodologyFramework(GetMethodologyFrameworkRequest) returns (GetMethodologyFrameworkResponse);
  rpc ListMethodologyFrameworks(ListMethodologyFrameworksRequest) returns (ListMethodologyFrameworksResponse);
  rpc GetMethodologyFrameworkBundle(GetMethodologyFrameworkBundleRequest) returns (GetMethodologyFrameworkBundleResponse);
  rpc UpsertTaxonomyScheme(UpsertTaxonomySchemeRequest) returns (UpsertTaxonomySchemeResponse);
  rpc GetTaxonomyScheme(GetTaxonomySchemeRequest) returns (GetTaxonomySchemeResponse);
  rpc ListTaxonomySchemes(ListTaxonomySchemesRequest) returns (ListTaxonomySchemesResponse);
  rpc UpsertEvidencePolicyRule(UpsertEvidencePolicyRuleRequest) returns (UpsertEvidencePolicyRuleResponse);
  rpc GetEvidencePolicyRule(GetEvidencePolicyRuleRequest) returns (GetEvidencePolicyRuleResponse);
  rpc ListEvidencePolicyRules(ListEvidencePolicyRulesRequest) returns (ListEvidencePolicyRulesResponse);
  rpc UpsertAssertionPolicyRule(UpsertAssertionPolicyRuleRequest) returns (UpsertAssertionPolicyRuleResponse);
  rpc GetAssertionPolicyRule(GetAssertionPolicyRuleRequest) returns (GetAssertionPolicyRuleResponse);
  rpc ListAssertionPolicyRules(ListAssertionPolicyRulesRequest) returns (ListAssertionPolicyRulesResponse);
  rpc UpsertReviewPolicy(UpsertReviewPolicyRequest) returns (UpsertReviewPolicyResponse);
  rpc GetReviewPolicy(GetReviewPolicyRequest) returns (GetReviewPolicyResponse);
  rpc ListReviewPolicies(ListReviewPoliciesRequest) returns (ListReviewPoliciesResponse);

  // Ontology Facts
  rpc ReviewOntologyFact(ReviewOntologyFactRequest) returns (ReviewOntologyFactResponse);
  rpc GetOntologyFact(GetOntologyFactRequest) returns (GetOntologyFactResponse);
  rpc ListOntologyFactReviews(ListOntologyFactReviewsRequest) returns (ListOntologyFactReviewsResponse);
  rpc ListOntologyFactEvidence(ListOntologyFactEvidenceRequest) returns (ListOntologyFactEvidenceResponse);
  rpc ListOntologyFactLinkedCases(ListOntologyFactLinkedCasesRequest) returns (ListOntologyFactLinkedCasesResponse);
  rpc ListOntologyFactLinkedAlerts(ListOntologyFactLinkedAlertsRequest) returns (ListOntologyFactLinkedAlertsResponse);
  rpc SelectOntologyFactsForBulkReview(SelectOntologyFactsForBulkReviewRequest) returns (SelectOntologyFactsForBulkReviewResponse);

  // Ontology Cases
  rpc InsertOntologyCase(InsertOntologyCaseRequest) returns (InsertOntologyCaseResponse);
  rpc GetOntologyCase(GetOntologyCaseRequest) returns (GetOntologyCaseResponse);
  rpc ListOntologyCases(ListOntologyCasesRequest) returns (ListOntologyCasesResponse);
  rpc UpdateOntologyCase(UpdateOntologyCaseRequest) returns (UpdateOntologyCaseResponse);
  rpc LinkOntologyCaseFact(LinkOntologyCaseFactRequest) returns (LinkOntologyCaseFactResponse);
  rpc ListOntologyCaseFacts(ListOntologyCaseFactsRequest) returns (ListOntologyCaseFactsResponse);
  rpc InsertOntologyCaseDecision(InsertOntologyCaseDecisionRequest) returns (InsertOntologyCaseDecisionResponse);
  rpc ListOntologyCaseDecisions(ListOntologyCaseDecisionsRequest) returns (ListOntologyCaseDecisionsResponse);
  rpc InsertOntologyCaseEvent(InsertOntologyCaseEventRequest) returns (InsertOntologyCaseEventResponse);
  rpc ListOntologyCaseEvents(ListOntologyCaseEventsRequest) returns (ListOntologyCaseEventsResponse);

  // Ontology Alerts
  rpc InsertOntologyAlert(InsertOntologyAlertRequest) returns (InsertOntologyAlertResponse);
  rpc GetOntologyAlertDetail(GetOntologyAlertDetailRequest) returns (GetOntologyAlertDetailResponse);
  rpc ListOntologyAlerts(ListOntologyAlertsRequest) returns (ListOntologyAlertsResponse);
  rpc UpdateOntologyAlert(UpdateOntologyAlertRequest) returns (UpdateOntologyAlertResponse);
  rpc RefreshTriggeredOntologyAlert(RefreshTriggeredOntologyAlertRequest) returns (RefreshTriggeredOntologyAlertResponse);

  // Ontology Ops
  rpc UpsertOntologyOpsRuleConfig(UpsertOntologyOpsRuleConfigRequest) returns (UpsertOntologyOpsRuleConfigResponse);
  rpc ListOntologyOpsRuleConfig(ListOntologyOpsRuleConfigRequest) returns (ListOntologyOpsRuleConfigResponse);
  rpc ListStalePendingOntologyCandidates(ListStalePendingOntologyCandidatesRequest) returns (ListOntologyFactsResponse);
  rpc ListConflictPredicateOntologyCandidates(ListConflictPredicateOntologyCandidatesRequest) returns (ListOntologyFactsResponse);
  rpc GetActiveOntologyCaseByTitle(GetActiveOntologyCaseByTitleRequest) returns (GetActiveOntologyCaseByTitleResponse);
  rpc GetActiveOntologyAlertByRuleKey(GetActiveOntologyAlertByRuleKeyRequest) returns (GetActiveOntologyAlertByRuleKeyResponse);
  rpc InsertOntologyOpsRuleRun(InsertOntologyOpsRuleRunRequest) returns (InsertOntologyOpsRuleRunResponse);
  rpc GetOntologyOpsRun(GetOntologyOpsRunRequest) returns (GetOntologyOpsRunResponse);
  rpc ListOntologyOpsRuns(ListOntologyOpsRunsRequest) returns (ListOntologyOpsRunsResponse);

  // Wiki layer
  rpc UpsertWikiPage(UpsertWikiPageRequest) returns (UpsertWikiPageResponse);
  rpc UpsertWikiPageLink(UpsertWikiPageLinkRequest) returns (UpsertWikiPageLinkResponse);
  rpc GetWikiPage(GetWikiPageRequest) returns (GetWikiPageResponse);
  rpc SearchWikiPages(SearchWikiPagesRequest) returns (SearchWikiPagesResponse);
  rpc ListWikiPages(ListWikiPagesRequest) returns (ListWikiPagesResponse);
  rpc ReinforceWikiPage(ReinforceWikiPageRequest) returns (ReinforceWikiPageResponse);
  rpc AppendWikiLog(AppendWikiLogRequest) returns (AppendWikiLogResponse);
  rpc ListWikiLogs(ListWikiLogsRequest) returns (ListWikiLogsResponse);
  rpc LintWikiDomain(LintWikiDomainRequest) returns (LintWikiDomainResponse);
}

message SearchQueryRequest {
  string query = 1;
  string case_id = 2;
  string stream_id = 3;
  repeated string stream_ids = 4;
  string mode = 5;
  int32 limit = 6;
  repeated double query_embedding = 7;
  double alpha = 8;
  string trace_id = 9;
  // When true, stream_id/stream_ids match the named stream and all
  // dot-delimited descendants (e.g. "kb.customer.bmw" includes
  // "kb.customer.bmw.sales"). Defaults to exact match.
  bool stream_prefix = 10;
  string domain = 11;
}

message SearchHit {
  string doc_id = 1;
  string case_id = 2;
  string stream_id = 3;
  string event_id = 4;
  int32 event_seq = 5;
  string content = 6;
  string metadata_json = 7;
  double lexical_score = 8;
  double vector_score = 9;
  double hybrid_score = 10;
}

message SearchQueryResponse {
  repeated SearchHit hits = 1;
  repeated string resolved_stream_ids = 2;
}

message DomainStreamBindingRecord {
  string binding_id = 1;
  string domain = 2;
  string stream_id = 3;
  string status = 4;
  string binding_kind = 5;
  string source = 6;
  int32 priority = 7;
  string created_at = 8;
  string updated_at = 9;
}

message UpsertDomainStreamBindingRequest {
  string domain = 1;
  string stream_id = 2;
  string status = 3;
  string binding_kind = 4;
  string source = 5;
  int32 priority = 6;
}

message UpsertDomainStreamBindingResponse {
  DomainStreamBindingRecord binding = 1;
}

message ListDomainStreamBindingsRequest {
  string domain = 1;
  string stream_id = 2;
  string status = 3;
  int32 limit = 4;
}

message ListDomainStreamBindingsResponse {
  repeated DomainStreamBindingRecord bindings = 1;
}

message IndexEventRequest {
  string case_id = 1;
  string stream_id = 2;
  string event_id = 3;
  int32 event_seq = 4;
  string content = 5;
  string metadata_json = 6;
  repeated double embedding = 7;
  string embedding_model = 8;
}

message IndexEventResponse {
  string doc_id = 1;
}

message AppendEventRequest {
  string case_id = 1;
  string stream_id = 2;
  string event_type = 3;
  string actor_id = 4;
  string subject_id = 5;
  string object_id = 6;
  string payload_json = 7;
  string event_text = 8;
  repeated double embedding = 9;
  string embedding_model = 10;
  string valid_time = 11;
  string system_time = 12;
}

message AppendEventResponse {
  string event_id = 1;
  int32 event_seq = 2;
  string system_time = 3;
}

message GetEventsRequest {
  string case_id = 1;
  int32 from_seq = 2;
  int32 to_seq = 3;
  int32 limit = 4;
}

message GetEventsResponse {
  repeated EventItem events = 1;
}

message EventItem {
  string event_id = 1;
  string case_id = 2;
  int32 event_seq = 3;
  string event_type = 4;
  string actor_id = 5;
  string subject_id = 6;
  string object_id = 7;
  string payload_json = 8;
  string valid_time = 9;
  string system_time = 10;
}

message GetEventSentencesRequest {
  string stream_id = 1;
  int32 limit = 2;
}

message EventSentenceRecord {
  string stream_id = 1;
  string event_id = 2;
  int32 sent_index = 3;
  int32 start_char = 4;
  int32 end_char = 5;
  string sentence_text = 6;
}

message GetEventSentencesResponse {
  repeated EventSentenceRecord sentences = 1;
}

message UpsertPropertyRequest {
  string object_id = 1;
  string key = 2;
  string value_json = 3;
  string valid_from = 4;
  string system_from = 5;
  string source_event_id = 6;
  float confidence = 7;
}

message UpsertPropertyResponse {
  PropertyRecord property = 1;
}

message GetPropertyAsOfRequest {
  string object_id = 1;
  string key = 2;
  string as_of_valid_time = 3;
  string as_of_system_time = 4;
}

message GetPropertyAsOfResponse {
  PropertyRecord property = 1;
}

message PropertyRecord {
  string property_state_id = 1;
  string object_id = 2;
  string key = 3;
  string value_json = 4;
  string valid_from = 5;
  string valid_to = 6;
  string system_from = 7;
  string system_to = 8;
  string source_event_id = 9;
  float confidence = 10;
}

message UpsertEdgeRequest {
  string src_id = 1;
  string predicate = 2;
  string dst_id = 3;
  string valid_from = 4;
  string system_from = 5;
  string source_event_id = 6;
  float confidence = 7;
}

message UpsertEdgeResponse {
  EdgeRecord edge = 1;
}

message GetEdgesAsOfRequest {
  string src_id = 1;
  string predicate = 2;
  string as_of_valid_time = 3;
  string as_of_system_time = 4;
}

message GetEdgesAsOfResponse {
  repeated EdgeRecord edges = 1;
}

message EdgeRecord {
  string edge_state_id = 1;
  string src_id = 2;
  string predicate = 3;
  string dst_id = 4;
  string valid_from = 5;
  string valid_to = 6;
  string system_from = 7;
  string system_to = 8;
  string source_event_id = 9;
  float confidence = 10;
}

message ListPropertyRowsRequest {
  string object_id = 1;
  string key = 2;
  int32 limit = 3;
}

message ListPropertyRowsResponse {
  repeated PropertyRecord properties = 1;
}

message UpsertEntityRequest {
  string entity_id = 1;
  string entity_type = 2;
  string display_name = 3;
  string external_refs_json = 4;
  string status = 5;
}

message UpsertEntityResponse {
  EntityRecord entity = 1;
}

message GetEntityRequest {
  string entity_id = 1;
}

message GetEntityResponse {
  EntityRecord entity = 1;
}

message ListEntitiesRequest {
  string entity_type = 1;
  string status = 2;
  string query = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ListEntitiesResponse {
  repeated EntityRecord entities = 1;
}

message EntityRecord {
  string entity_id = 1;
  string entity_type = 2;
  string display_name = 3;
  string external_refs_json = 4;
  string status = 5;
  string created_at = 6;
  string updated_at = 7;
}

message WriteSnapshotRequest {
  string case_id = 1;
  int64 event_seq = 2;
  string projection_version = 3;
  string state_blob_json = 4;
  string state_hash = 5;
}

message WriteSnapshotResponse {
  SnapshotRecord snapshot = 1;
}

message GetLatestSnapshotRequest {
  string case_id = 1;
  string projection_version = 2;
  int64 target_seq = 3;
}

message GetLatestSnapshotResponse {
  SnapshotRecord snapshot = 1;
}

message SnapshotRecord {
  string snapshot_id = 1;
  string case_id = 2;
  int64 event_seq = 3;
  string projection_version = 4;
  string state_blob_json = 5;
  string state_hash = 6;
  string created_at = 7;
}

message CreateArtifactRequest {
  string artifact_type = 1;
  string name = 2;
  string description = 3;
}

message CreateArtifactResponse {
  ArtifactRecord artifact = 1;
}

message CreateArtifactVersionRequest {
  string artifact_id = 1;
  int32 version_number = 2;
  string status = 3;
  string valid_from = 4;
  string valid_to = 5;
  string system_from = 6;
  string content_ref = 7;
  string content_hash = 8;
  string author_id = 9;
  string approver_id = 10;
}

message CreateArtifactVersionResponse {
  ArtifactVersionRecord version = 1;
}

message GetArtifactVersionAsOfRequest {
  string artifact_id = 1;
  string as_of_valid_time = 2;
}

message GetArtifactVersionAsOfResponse {
  ArtifactVersionRecord version = 1;
}

message GetArtifactVersionByIdRequest {
  string artifact_version_id = 1;
}

message GetArtifactVersionByIdResponse {
  ArtifactVersionRecord version = 1;
}

message ArtifactRecord {
  string artifact_id = 1;
  string artifact_type = 2;
  string name = 3;
  string description = 4;
  string created_at = 5;
}

message ArtifactVersionRecord {
  string artifact_version_id = 1;
  string artifact_id = 2;
  int32 version_number = 3;
  string status = 4;
  string valid_from = 5;
  string valid_to = 6;
  string system_from = 7;
  string system_to = 8;
  string content_ref = 9;
  string content_hash = 10;
  string author_id = 11;
  string approver_id = 12;
  string created_at = 13;
}

message UpsertDecisionRequest {
  string case_id = 1;
  int64 event_seq = 2;
  string projection_version = 3;
  string chosen_action = 4;
  string candidates_json = 5;
  string scores_json = 6;
  repeated string constraints_hit = 7;
  string detail_json = 8;
}

message UpsertDecisionResponse {
  DecisionRecord decision = 1;
}

message InsertDecisionEvidenceRequest {
  string decision_id = 1;
  string artifact_version_id = 2;
  string citation_json = 3;
}

message InsertDecisionEvidenceResponse {
  DecisionEvidenceRecord evidence = 1;
}

message FindDecisionRequest {
  string case_id = 1;
  int64 event_seq = 2;
  string projection_version = 3;
}

message FindDecisionResponse {
  DecisionRecord decision = 1;
}

message ListDecisionEvidenceRequest {
  string decision_id = 1;
}

message ListDecisionEvidenceResponse {
  repeated DecisionEvidenceRecord evidence = 1;
}

message DecisionRecord {
  string decision_id = 1;
  string case_id = 2;
  int64 event_seq = 3;
  string projection_version = 4;
  string chosen_action = 5;
  string candidates_json = 6;
  string scores_json = 7;
  repeated string constraints_hit = 8;
  string detail_json = 9;
  string created_at = 10;
}

message DecisionEvidenceRecord {
  string decision_evidence_id = 1;
  string decision_id = 2;
  string artifact_version_id = 3;
  string citation_json = 4;
  string created_at = 5;
}

message UpsertAssertionRequest {
  string assertion_id = 1;
  string case_id = 2;
  string subject_type = 3;
  string subject_id = 4;
  string predicate = 5;
  string object_type = 6;
  string object_id = 7;
  string object_literal_json = 8;
  string assertion_type = 9;
  string asserted_by_type = 10;
  string asserted_by_id = 11;
  float confidence = 12;
