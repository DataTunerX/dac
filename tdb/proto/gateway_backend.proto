// ── Wiki layer messages ────────────────────────────────────────────────────

message WikiPageRecord {
  string page_id = 1;
  string domain = 2;
  string slug = 3;
  string title = 4;
  string content = 5;
  string page_type = 6;
  string tags_json = 7;
  int32 source_count = 8;
  float confidence = 9;
  string last_reinforced_at = 10;
  string created_at = 11;
  string updated_at = 12;
  string superseded_by = 13;
  string knowledge_level = 14;
  string authority_kind = 15;
}

message UpsertWikiPageRequest {
  string domain = 1;
  string slug = 2;
  string title = 3;
  string content = 4;
  string page_type = 5;
  string tags_json = 6;
  float confidence = 7;
  string source_ref = 8;
  // If true, preserve the current page as a historical version and create a new
  // current page with the same slug. superseded_page_id in the response will be
  // set to the old page's ID. If false (default), the existing page is overwritten.
  bool supersede = 9;
  string knowledge_level = 10;
  string authority_kind = 11;
}

message UpsertWikiPageResponse {
  string page_id = 1;
  string slug = 2;
  // "created" | "updated" | "versioned" (supersede=true and prior version existed)
  string status = 3;
  // Set when status=="versioned": the page_id of the now-superseded old version.
  string superseded_page_id = 4;
}

message UpsertWikiPageLinkRequest {
  string domain = 1;
  string from_slug = 2;
  string to_slug = 3;
  string link_text = 4;
}

message UpsertWikiPageLinkResponse {
  string from_page_id = 1;
  string to_page_id = 2;
  string status = 3;
}

message GetWikiPageRequest {
  string domain = 1;
  string slug = 2;
}

message GetWikiPageResponse {
  WikiPageRecord page = 1;
}

message SearchWikiPagesRequest {
  string domain = 1;
  string query = 2;
  string page_type = 3;
  int32 limit = 4;
  string knowledge_level = 5;
  string authority_kind = 6;
}

message SearchWikiPagesResponse {
  repeated WikiPageRecord pages = 1;
}

message ListWikiPagesRequest {
  string domain = 1;
  // Optional: filter by page_type (empty = return all types)
  string page_type = 2;
  string knowledge_level = 3;
  string authority_kind = 4;
  bool include_content = 5;
  int32 limit = 6;
  int32 offset = 7;
}

message ListWikiPagesResponse {
  repeated WikiPageRecord pages = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ReinforceWikiPageRequest {
  string page_id = 1;
  float delta_confidence = 2;
}

message ReinforceWikiPageResponse {
  WikiPageRecord page = 1;
}

message WikiLogRecord {
  string log_id = 1;
  string domain = 2;
  string action_type = 3;
  string source_ref = 4;
  int32 pages_touched = 5;
  string summary = 6;
  string created_at = 7;
}

message AppendWikiLogRequest {
  string domain = 1;
  string action_type = 2;
  string source_ref = 3;
  int32 pages_touched = 4;
  string summary = 5;
}

message AppendWikiLogResponse {
  WikiLogRecord log = 1;
}

message ListWikiLogsRequest {
  string domain = 1;
  int32 limit = 2;
}

message ListWikiLogsResponse {
  repeated WikiLogRecord logs = 1;
}

message WikiLintIssue {
  string type = 1;
  string page_id = 2;
  string slug = 3;
  string description = 4;
  string severity = 5;
}

message LintWikiDomainRequest {
  string domain = 1;
}

message LintWikiDomainResponse {
  repeated WikiLintIssue issues = 1;
}
