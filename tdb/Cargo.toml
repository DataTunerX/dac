[package]
name = "tdb"
version = "0.1.1"
edition = "2024"
build = "build.rs"

description = "TDB Cognitive Asset Engine PoC"
license = "Apache-2.0"

# -------------------------
# Dependencies
# -------------------------

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tokio-stream = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "time", "uuid", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
prost = "0.13"
tonic = { version = "0.12", features = ["transport"] }
tonic-health = "0.12"
uuid = { version = "1.23.0", features = ["v4", "serde", "v5"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"


# -------------------------
# Development profile
# -------------------------
[profile.dev]
debug = true
overflow-checks = true

# -------------------------
# Release profile
# -------------------------
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
