services:
  postgres:
    image: postgres:16
    container_name: dac-sandbox-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dacpass}
      POSTGRES_DB: ${POSTGRES_DB:-dac_sandbox}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./seed/postgres:/docker-entrypoint-initdb.d:ro
      - dac_sandbox_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  metastore-db:
    image: postgres:16
    container_name: dac-sandbox-metastore-db
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepass
      POSTGRES_DB: metastore
    volumes:
      - dac_sandbox_metastore_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: dac-sandbox-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - dac_sandbox_minio:/data

  minio-init:
    image: minio/mc:latest
    container_name: dac-sandbox-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./seed/minio:/seed:ro
    entrypoint: ["/bin/sh", "/seed/init.sh"]
    restart: "no"

  hive-metastore:
    image: starburstdata/hive:3.1.2-e.15
    container_name: dac-sandbox-hive-metastore
    depends_on:
      metastore-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "9083:9083"
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://metastore-db:5432/metastore
      HIVE_METASTORE_USER: hive
      HIVE_METASTORE_PASSWORD: hivepass
      HIVE_METASTORE_WAREHOUSE_DIR: s3://lake/warehouse/
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_PATH_STYLE_ACCESS: "true"
      REGION: us-east-1
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
      AZURE_WASB_ACCESS_KEY: ""

  trino:
    image: trinodb/trino:latest
    container_name: dac-sandbox-trino
    depends_on:
      postgres:
        condition: service_healthy
      hive-metastore:
        condition: service_started
    ports:
      - "${TRINO_PORT:-8080}:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dacpass}
      POSTGRES_DB: ${POSTGRES_DB:-dac_sandbox}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./trino/etc:/etc/trino:ro

  trino-init:
    image: trinodb/trino:latest
    container_name: dac-sandbox-trino-init
    depends_on:
      - trino
      - hive-metastore
    volumes:
      - ./seed/trino:/seed:ro
    entrypoint: ["/bin/sh", "/seed/init-cli.sh"]
    restart: "no"

  nextcloud-db:
    image: mariadb:11
    container_name: dac-sandbox-nextcloud-db
    environment:
      MYSQL_ROOT_PASSWORD: nextcloudroot
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloudpass
    volumes:
      - dac_sandbox_nextcloud_db:/var/lib/mysql

  nextcloud:
    image: nextcloud:29-apache
    container_name: dac-sandbox-nextcloud
    depends_on:
      - nextcloud-db
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloudpass
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-adminpass}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost 127.0.0.1"
    ports:
      - "8011:80"
    volumes:
      - dac_sandbox_nextcloud:/var/www/html

  odoo-db:
    image: postgres:16
    container_name: dac-sandbox-odoo-db
    environment:
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoopass}
      POSTGRES_DB: ${ODOO_DB_NAME:-postgres}
    volumes:
      - dac_sandbox_odoo_db:/var/lib/postgresql/data

  odoo:
    image: odoo:17
    container_name: dac-sandbox-odoo
    depends_on:
      - odoo-db
    environment:
      HOST: odoo-db
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoopass}
    ports:
      - "8012:8069"
    volumes:
      - dac_sandbox_odoo:/var/lib/odoo

  gitea:
    image: gitea/gitea:1.21.11
    container_name: dac-sandbox-gitea
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:8013/
      GITEA__server__HTTP_PORT: 3000
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__security__INSTALL_LOCK: "true"
    ports:
      - "8013:3000"
    volumes:
      - dac_sandbox_gitea:/data

  gitea-init:
    image: gitea/gitea:1.21.11
    container_name: dac-sandbox-gitea-init
    user: "1000:1000"
    depends_on:
      - gitea
    environment:
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-giteaadmin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-giteaadminpass}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-admin@example.com}
      GITEA_REPO_NAME: ${SOURCE_REPO_NAME:-sample-project}
    volumes:
      - ./seed/gitea:/seed:ro
      - dac_sandbox_gitea:/data
      - ${SOURCE_REPO_PATH:?请在 .env 中设置 SOURCE_REPO_PATH}:/src:ro
    entrypoint: ["/bin/sh", "/seed/init.sh"]
    restart: "no"

volumes:
  dac_sandbox_postgres:
  dac_sandbox_metastore_db:
  dac_sandbox_minio:
  dac_sandbox_nextcloud_db:
  dac_sandbox_nextcloud:
  dac_sandbox_odoo_db:
  dac_sandbox_odoo:
  dac_sandbox_gitea:
