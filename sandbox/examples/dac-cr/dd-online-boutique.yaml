# DAC sandbox demo: Google Online Boutique 微服务电商演示（代码仓）
# 运行时入口: <sts-pod-ip>:8080 或 frontend.dac-sandbox.svc.cluster.local:80 → 8080
apiVersion: dac.dac.io/v1alpha1
kind: DataDescriptor
metadata:
  name: dd-sandbox-online-boutique
  namespace: dac
  labels:
    app.kubernetes.io/name: execution-engine
    app.kubernetes.io/managed-by: kustomize
spec:
  descriptorType: "code"
  sources:
    - type: coderepo
      name: "sandbox-online-boutique"
      metadata:
        host: "github.com"
        port: "443"
      codeRepo:
        codeRepoType: "github"
        codeRepoPath: "https://github.com/GoogleCloudPlatform/microservices-demo.git"
        codeRepoBranch: "main"
        codeRepoToken: ""
      prompts:
        prompts:
          name: ""
