apiVersion: batch/v1
kind: Job
metadata:
  name: dac-sandbox-minio-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dac-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-seed
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minio-seed
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: seed
          image: {{ include "dac-sandbox.sandboxImage" (dict "Values" .Values "name" "sandbox-minio-seed") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MINIO_ENDPOINT
              value: "http://dac-sandbox.{{ .Release.Namespace }}.svc.cluster.local:9000"
            - name: MINIO_ROOT_USER
              value: {{ .Values.credentials.minioRootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.credentials.minioRootPassword | quote }}
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
