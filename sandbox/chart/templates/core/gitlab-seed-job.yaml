apiVersion: batch/v1
kind: Job
metadata:
  name: dac-sandbox-gitlab-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dac-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitlab-seed
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gitlab-seed
    spec:
      restartPolicy: OnFailure
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: seed
          image: {{ include "dac-sandbox.sandboxImage" (dict "Values" .Values "name" "sandbox-gitlab-seed") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: GITLAB_URL
              value: "http://gitlab.{{ .Release.Namespace }}.svc.cluster.local:8929"
            - name: GITLAB_ROOT_PASSWORD
              value: {{ .Values.credentials.gitlabRootPassword | quote }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
