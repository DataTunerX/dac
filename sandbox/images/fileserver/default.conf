server {
    listen 8000 default_server;
    listen [::]:8000 default_server;

    server_name _;

    root /usr/share/nginx/html;

    # 列目录方便人工/扫描器一眼看到全部文件
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime  on;

    # CORS 简单放开，方便前端预览
    add_header Access-Control-Allow-Origin "*" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
