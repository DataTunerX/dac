apiVersion: v1
kind: ConfigMap
metadata:
  name: dac-sandbox-trino-seed
  namespace: dac-sandbox
data:
  init-cli.sh: |
    #!/bin/sh
    set -eu
    
    TRINO_SERVER="${TRINO_SERVER:-http://dac-sandbox-host:8080}"
    
    echo "[trino-init] waiting for Trino to accept queries at ${TRINO_SERVER}..."
    for i in $(seq 1 240); do
      if trino --server "$TRINO_SERVER" --user sandbox --execute "SELECT 1" >/dev/null 2>&1; then
        break
      fi
      sleep 1
    done
    
    echo "[trino-init] running /seed/init.sql"
    trino --server "$TRINO_SERVER" --user sandbox --catalog hive -f /seed/init.sql
    echo "[trino-init] done"
  init.sql: |
    CREATE SCHEMA IF NOT EXISTS hive.demo WITH (location = 's3://lake/warehouse/demo.db');
    
    DROP TABLE IF EXISTS hive.demo.orders;
    CREATE TABLE hive.demo.orders (
      order_id VARCHAR,
      customer_id VARCHAR,
      order_ts VARCHAR,
      status VARCHAR,
      amount_usd VARCHAR,
      payment_card_last4 VARCHAR,
      notes VARCHAR
    ) WITH (
      external_location = 's3://lake/warehouse/demo.db/orders/',
      format = 'CSV',
      skip_header_line_count = 1
    );

