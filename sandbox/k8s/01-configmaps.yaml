apiVersion: v1
kind: ConfigMap
metadata:
  name: dac-sandbox-minio-seed
  namespace: dac-sandbox
data:
  init.sh: |
    #!/bin/sh
    set -eu
    
    MINIO_ENDPOINT="${MINIO_ENDPOINT:-http://dac-sandbox-host:9000}"
    
    echo "[minio-init] waiting for minio at ${MINIO_ENDPOINT}..."
    for i in $(seq 1 120); do
      if mc alias set minio "${MINIO_ENDPOINT}" "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; then
        break
      fi
      sleep 1
    done
    
    mc alias set minio "${MINIO_ENDPOINT}" "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
    
    echo "[minio-init] ensure buckets..."
    mc mb -p minio/objects || true
    mc mb -p minio/lake || true
    
    echo "[minio-init] upload seeded objects..."
    mc cp --recursive /seed/objects/ minio/objects/ || true
    mc cp --recursive /seed/lake/ minio/lake/ || true
    
    echo "[minio-init] done"
  objects-erp-exports-customers.csv: |
    customer_id,full_name,email,phone,national_id,address
    11111111-1111-1111-1111-111111111111,Alice Zhang,alice@example.com,+1-415-555-0101,ID-ALICE-0001,"1 Market St, SF"
    22222222-2222-2222-2222-222222222222,Bob Li,bob@example.com,+1-415-555-0202,ID-BOB-0002,"2 Market St, SF"
    33333333-3333-3333-3333-333333333333,Carol Wang,carol@example.com,+1-415-555-0303,ID-CAROL-0003,"3 Market St, SF"
  objects-o365-drive-readme.txt: |
    This is a mock Office365 Drive document.
    Owner: alice
    Contains: project notes, contacts, and other text.
  lake-warehouse-demo.db-orders-orders.csv: |
    order_id,customer_id,order_ts,status,amount_usd,payment_card_last4,notes
    aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa,11111111-1111-1111-1111-111111111111,2026-01-02T10:00:00Z,PAID,120.50,1234,first order
    bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb,22222222-2222-2222-2222-222222222222,2026-01-09T08:00:00Z,PENDING,88.00,9876,needs review
    cccccccc-cccc-cccc-cccc-cccccccccccc,33333333-3333-3333-3333-333333333333,2026-01-11T12:00:00Z,PAID,15.99,5555,promo applied

