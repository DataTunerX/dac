# Saleor 开源电商平台（API + Dashboard + Postgres + Valkey + populatedb 演示数据）
# API 端口 8000；Dashboard Service 9000 → 容器 80（路径 /dashboard/）
# Dashboard 经 nginx 反代 /graphql/、/media/ → saleor-api；API_URL 用相对路径 /graphql/（适配 Pod IP / port-forward）
# 凭据：admin@example.com / admin
---
apiVersion: v1
kind: Service
metadata:
  name: saleor-db
  namespace: dac-sandbox
  labels:
    app.kubernetes.io/name: saleor
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app: saleor-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saleor-db
  namespace: dac-sandbox
  labels:
    app.kubernetes.io/name: saleor
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saleor-db
  template:
    metadata:
      labels:
        app: saleor-db
    spec:
      containers:
        - name: postgres
          image: release.daocloud.io/dac/postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: saleor
            - name: POSTGRES_PASSWORD
              value: saleor
            - name: POSTGRES_DB
              value: saleor
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "saleor", "-h", "127.0.0.1"]
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: saleor-cache
  namespace: dac-sandbox
  labels:
    app.kubernetes.io/name: saleor
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  selector:
    app: saleor-cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saleor-cache
  namespace: dac-sandbox
  labels:
    app.kubernetes.io/name: saleor
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saleor-cache
  template:
    metadata:
      labels:
        app: saleor-cache
    spec:
      containers:
        - name: valkey
          image: release.daocloud.io/dac/valkey:8.1-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: saleor-api
  namespace: dac-sandbox
  labels:
    app.kubernetes.io/name: saleor
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app: saleor-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saleor-api
  namespace: dac-sandbox
  labels:
    app.kubernetes.io/name: saleor
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saleor-api
  template:
    metadata:
      labels:
        app: saleor-api
    spec:
      initContainers:
        - name: wait-deps
          image: release.daocloud.io/dac/alpine:3.20
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              apk add --no-cache postgresql-client >/dev/null
              until pg_isready -h saleor-db -U saleor; do
                echo "waiting saleor-db..."
                sleep 3
              done
              until nc -z saleor-cache 6379; do
                echo "waiting saleor-cache..."
                sleep 3
              done
        - name: migrate
          image: release.daocloud.io/dac/saleor:3.23
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgres://saleor:saleor@saleor-db:5432/saleor
            - name: SECRET_KEY
              value: sandbox-saleor-secret-key-change-me
          command:
            - python3
            - manage.py
            - migrate
            - --noinput
      containers:
        - name: api
          image: release.daocloud.io/dac/saleor:3.23
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgres://saleor:saleor@saleor-db:5432/saleor
            - name: CACHE_URL
              value: redis://saleor-cache:6379/0
            - name: CELERY_BROKER_URL
              value: redis://saleor-cache:6379/1
            - name: SECRET_KEY
              value: sandbox-saleor-secret-key-change-me
            - name: ALLOWED_HOSTS
              value: "*"
            - name: DEBUG
              value: "True"
            - name: DEFAULT_CHANNEL_SLUG
              value: default-channel
            - name: HTTP_IP_FILTER_ENABLED
              value: "False"
            - name: DASHBOARD_URL
              value: http://saleor-dashboard:9000/
          readinessProbe:
            httpGet:
              path: /graphql/
              port: 8000
              httpHeaders:
                - name: Host
                  value: saleor-api
            initialDelaySeconds: 40
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: saleor-dashboard-nginx
  namespace: dac-sandbox
  labels:
    app.kubernetes.io/name: saleor
    app.kubernetes.io/component: dashboard
data:
  default.conf: |
    server {
      listen 80;
      server_name localhost;
      root /app/dashboard/;

      add_header Referrer-Policy origin-when-cross-origin;

      location /graphql/ {
        proxy_pass http://saleor-api:8000/graphql/;
        proxy_set_header Host saleor-api;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /media/ {
        proxy_pass http://saleor-api:8000/media/;
        proxy_set_header Host saleor-api;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        alias /app/dashboard/;
        index index.html;
        try_files $uri $uri/ /dashboard/index.html;
      }

      location /dashboard/ {
        alias /app/dashboard/;
        index index.html;
        try_files $uri $uri/ /dashboard/index.html;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: saleor-dashboard
  namespace: dac-sandbox
  labels:
    app.kubernetes.io/name: saleor
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app: saleor-dashboard
  ports:
    - name: http
      port: 9000
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saleor-dashboard
  namespace: dac-sandbox
  labels:
    app.kubernetes.io/name: saleor
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saleor-dashboard
  template:
    metadata:
      labels:
        app: saleor-dashboard
    spec:
      initContainers:
        - name: wait-api
          image: release.daocloud.io/dac/alpine:3.20
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              apk add --no-cache curl >/dev/null
              for i in $(seq 1 90); do
                if curl -fsS -H "Host: saleor-api" http://saleor-api:8000/graphql/ >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 5
              done
              echo "saleor-api not ready"
              exit 1
      containers:
        - name: dashboard
          image: release.daocloud.io/dac/saleor-dashboard:3.23
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            # 相对路径：浏览器按当前访问地址解析，Pod IP:80 与 port-forward 9000 均可用
            - name: API_URL
              value: "/graphql/"
            - name: APP_MOUNT_URI
              value: "/dashboard/"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /dashboard/
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: nginx-config
          configMap:
            name: saleor-dashboard-nginx
---
apiVersion: batch/v1
kind: Job
metadata:
  name: saleor-populatedb
  namespace: dac-sandbox
  labels:
    app.kubernetes.io/name: saleor
    app.kubernetes.io/component: seed
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-api
          image: release.daocloud.io/dac/alpine:3.20
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              apk add --no-cache curl >/dev/null
              for i in $(seq 1 90); do
                if curl -fsS http://saleor-api:8000/graphql/ >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 5
              done
              echo "saleor-api not ready"
              exit 1
      containers:
        - name: populate
          image: release.daocloud.io/dac/saleor:3.23
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgres://saleor:saleor@saleor-db:5432/saleor
            - name: CACHE_URL
              value: redis://saleor-cache:6379/0
            - name: CELERY_BROKER_URL
              value: redis://saleor-cache:6379/1
            - name: SECRET_KEY
              value: sandbox-saleor-secret-key-change-me
            - name: ALLOWED_HOSTS
              value: "*"
            - name: DEFAULT_CHANNEL_SLUG
              value: default-channel
          command:
            - python3
            - manage.py
            - populatedb
            - --createsuperuser
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
