apiVersion: v1
kind: Service
metadata:
  name: dac-sandbox-host-headless
  namespace: dac-sandbox
spec:
  clusterIP: None
  selector:
    app: dac-sandbox-host
  ports:
    - name: pg
      port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: dac-sandbox-host
  namespace: dac-sandbox
spec:
  type: ClusterIP
  selector:
    app: dac-sandbox-host
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
    - name: metastore-db
      port: 5433
      targetPort: 5433
    - name: odoo-db
      port: 5434
      targetPort: 5434
    - name: minio
      port: 9000
      targetPort: 9000
    - name: minio-console
      port: 9001
      targetPort: 9001
    - name: hive-metastore
      port: 9083
      targetPort: 9083
    - name: trino
      port: 8080
      targetPort: 8080
    - name: nextcloud
      port: 80
      targetPort: 80
    - name: odoo
      port: 8069
      targetPort: 8069
    - name: gitea
      port: 3000
      targetPort: 3000

