# MinIO 一次性灌种子 Job：等 MinIO ready → 建 bucket → 上传 seed/files 和 seed/datasets
# Pod 启动失败时会自动重试。完成后变成 Completed，不会再跑。
apiVersion: batch/v1
kind: Job
metadata:
  name: dac-sandbox-minio-seed
  namespace: dac-sandbox
  labels:
    app.kubernetes.io/name: dac-sandbox
    app.kubernetes.io/component: minio-seed
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: release.daocloud.io/dac/sandbox-minio-seed:v0.11.0
          imagePullPolicy: Always
          env:
            - name: MINIO_ENDPOINT
              value: "http://dac-sandbox.dac-sandbox.svc.cluster.local:9000"
            - name: MINIO_ROOT_USER
              value: "dac"
            - name: MINIO_ROOT_PASSWORD
              value: "dacpassword"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
