# 单 Pod 五容器：MySQL + PostgreSQL + MinIO + FileServer + GitLab CE
# 共享一个 Pod IP，方便 DAC 前端用一个目标 IP 扫出 5 个服务（6 个端口）。
# emptyDir 数据卷：apply -f k8s/ 即用，不依赖 PV；删 Pod 数据自然丢，需要持久化时自行加 PVC。
#
# 注意：GitLab CE 较重，单机至少需要 4Gi 可用内存，首次启动 reconfigure 约 3-5 分钟。
# 如果资源紧张，可改用更轻量的方式（直接指向公网 GitHub/Gitee，不部署 in-cluster Git 服务）。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dac-sandbox
  namespace: dac-sandbox
  labels:
    app.kubernetes.io/name: dac-sandbox
spec:
  serviceName: dac-sandbox
  replicas: 1
  selector:
    matchLabels:
      app: dac-sandbox
  template:
    metadata:
      labels:
        app: dac-sandbox
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        # ---------- MySQL ----------
        - name: mysql
          image: release.daocloud.io/dac/sandbox-mysql:v0.10.0
          imagePullPolicy: Always  # sandbox 自定义镜像同 tag 反复迭代
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "dacpass"
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

        # ---------- PostgreSQL ----------
        - name: postgres
          image: release.daocloud.io/dac/sandbox-postgres:v0.10.0
          imagePullPolicy: Always  # sandbox 自定义镜像同 tag 反复迭代
          env:
            - name: POSTGRES_PASSWORD
              value: "dacpass"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

        # ---------- MinIO ----------
        - name: minio
          image: release.daocloud.io/dac/minio:latest
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            # MinIO 强制要求 secret key ≥ 8 字符，所以这里用 dacpassword 而不是 dacpass
            - name: MINIO_ROOT_USER
              value: "dac"
            - name: MINIO_ROOT_PASSWORD
              value: "dacpassword"
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: minio-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

        # ---------- FileServer (HTTP 静态) ----------
        - name: fileserver
          image: release.daocloud.io/dac/sandbox-fileserver:v0.10.0
          imagePullPolicy: Always  # sandbox 自定义镜像同 tag 反复迭代
          ports:
            - name: files
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

        # ---------- GitLab CE ----------
        # GitLab Omnibus 集成镜像。通过 GITLAB_OMNIBUS_CONFIG 设置:
        #   external_url: 让 nginx 在 8929 监听 (避开宿主机常用端口)
        #   initial_root_password: 启动时把 root 密码固定下来，gitlab-seed Job 直接 ROPC 拿 token
        # 关闭 prometheus / alertmanager / mattermost 等周边组件，降低内存占用。
        # 注意: GitLab 16.0 起已从 Omnibus 移除内置 Grafana，无需也不能再配置 grafana[*]。
        - name: gitlab
          image: release.daocloud.io/dac/gitlab-ce:17.5.0-ce.0
          imagePullPolicy: IfNotPresent
          env:
            # GitLab 强制要求 root 初始密码 ≥ 8 字符，所以这里用 dacpassword 而不是 dacpass
            - name: GITLAB_ROOT_PASSWORD
              value: "dacpassword"
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab:8929'
                gitlab_rails['initial_root_password'] = 'dacpassword'
                gitlab_rails['gitlab_shell_ssh_port'] = 22
                # 关闭打包内的可观测组件，省内存
                prometheus_monitoring['enable'] = false
                alertmanager['enable'] = false
                node_exporter['enable'] = false
                redis_exporter['enable'] = false
                postgres_exporter['enable'] = false
                gitlab_exporter['enable'] = false
                mattermost['enable'] = false
                registry['enable'] = false
                # KAS (Kubernetes Agent Server) sandbox 不需要，关掉以避免反复打 DNS lookup 错误日志
                gitlab_kas['enable'] = false
                # 允许 kube-probe 访问 /-/readiness、/-/liveness（默认仅 127.0.0.0/8 放行）
                gitlab_rails['monitoring_whitelist'] = ['0.0.0.0/0']
                # Puma worker 收到 1 个，单机 sandbox 够用
                puma['worker_processes'] = 1
                sidekiq['max_concurrency'] = 5
                # 加快 reconfigure
                gitlab_rails['env'] = { 'GITLAB_LOG_LEVEL' => 'WARN' }
          ports:
            - name: gitlab-http
              containerPort: 8929
          volumeMounts:
            - name: gitlab-config
              mountPath: /etc/gitlab
            - name: gitlab-logs
              mountPath: /var/log/gitlab
            - name: gitlab-data
              mountPath: /var/opt/gitlab
          # GitLab 17 已移除 /-/health，统一改用 /-/liveness (轻量) 与 /-/readiness (含依赖检查)
          # 这两个端点要求 IP 在 monitoring_whitelist 内，已在 GITLAB_OMNIBUS_CONFIG 放开。
          startupProbe:
            httpGet:
              path: /-/liveness
              port: 8929
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 48     # 60s + 48*10s ≈ 9 分钟
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: 8929
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"
            limits:
              cpu: "2000m"
              memory: "8Gi"

      volumes:
        - name: mysql-data
          emptyDir: {}
        - name: postgres-data
          emptyDir: {}
        - name: minio-data
          emptyDir: {}
        - name: gitlab-config
          emptyDir: {}
        - name: gitlab-logs
          emptyDir: {}
        - name: gitlab-data
          emptyDir: {}
