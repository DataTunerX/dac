apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dac-sandbox-host
  namespace: dac-sandbox
spec:
  serviceName: dac-sandbox-host-headless
  replicas: 1
  selector:
    matchLabels:
      app: dac-sandbox-host
  template:
    metadata:
      labels:
        app: dac-sandbox-host
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: postgres-init
          configMap:
            name: dac-sandbox-postgres-init
        # Ephemeral storage only (no PVC). All data will be reset when Pod is recreated.
        - name: pg-data
          emptyDir: {}
        - name: metastore-db-data
          emptyDir: {}
        - name: minio-data
          emptyDir: {}
        - name: nextcloud-db-data
          emptyDir: {}
        - name: nextcloud-data
          emptyDir: {}
        - name: odoo-db-data
          emptyDir: {}
        - name: odoo-data
          emptyDir: {}
        - name: gitea-data
          emptyDir: {}
        # Ensure /tmp is writable even if the image/rootfs has restrictive perms.
        - name: tmp
          emptyDir: {}
        - name: trino-etc
          configMap:
            name: dac-sandbox-trino-etc
            items:
              - key: config.properties
                path: config.properties
              - key: jvm.config
                path: jvm.config
              - key: node.properties
                path: node.properties
              - key: catalog-hive.properties
                path: catalog/hive.properties
              - key: catalog-postgres.properties
                path: catalog/postgres.properties
        - name: trino-data
          emptyDir: {}
      containers:
        # Postgres (ERP-like DB)
        - name: postgres
          image: release.daocloud.io/dac/postgres:16
          ports:
            - containerPort: 5432
              name: pg
          env:
            - name: POSTGRES_USER
              value: dac
            - name: POSTGRES_PASSWORD
              value: dacpass
            - name: POSTGRES_DB
              value: dac_sandbox
          volumeMounts:
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: pg-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5

        # Postgres for Hive Metastore (port=5433 to avoid conflict)
        - name: metastore-db
          image: release.daocloud.io/dac/postgres:16
          args: ["-c", "port=5433"]
          ports:
            - containerPort: 5433
              name: metastore-db
          env:
            - name: POSTGRES_USER
              value: hive
            - name: POSTGRES_PASSWORD
              value: hivepass
            - name: POSTGRES_DB
              value: metastore
          volumeMounts:
            - name: metastore-db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -p 5433 -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5

        # MinIO (S3-compatible object store)
        - name: minio
          image: release.daocloud.io/dac/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
              name: minio
            - containerPort: 9001
              name: minio-console
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          volumeMounts:
            - name: minio-data
              mountPath: /data

        # Hive Metastore (Thrift 9083)
        - name: hive-metastore
          image: release.daocloud.io/dac/starburst-hive:3.1.2-e.15
          ports:
            - containerPort: 9083
              name: metastore
          env:
            - name: HIVE_METASTORE_DRIVER
              value: org.postgresql.Driver
            - name: HIVE_METASTORE_JDBC_URL
              value: jdbc:postgresql://127.0.0.1:5433/metastore
            - name: HIVE_METASTORE_USER
              value: hive
            - name: HIVE_METASTORE_PASSWORD
              value: hivepass
            - name: HIVE_METASTORE_WAREHOUSE_DIR
              value: s3://lake/warehouse/
            - name: S3_ENDPOINT
              value: http://127.0.0.1:9000
            - name: S3_ACCESS_KEY
              value: minioadmin
            - name: S3_SECRET_KEY
              value: minioadmin
            - name: S3_PATH_STYLE_ACCESS
              value: "true"
            - name: REGION
              value: us-east-1
            # The image entrypoint scripts expect these env vars to be defined (even empty).
            - name: GOOGLE_CLOUD_KEY_FILE_PATH
              value: ""
            - name: AZURE_ADL_CLIENT_ID
              value: ""
            - name: AZURE_ADL_CREDENTIAL
              value: ""
            - name: AZURE_ADL_REFRESH_URL
              value: ""
            - name: AZURE_ABFS_STORAGE_ACCOUNT
              value: ""
            - name: AZURE_ABFS_ACCESS_KEY
              value: ""
            - name: AZURE_WASB_STORAGE_ACCOUNT
              value: ""
            - name: AZURE_ABFS_OAUTH
              value: ""
            - name: AZURE_ABFS_OAUTH_TOKEN_PROVIDER
              value: ""
            - name: AZURE_ABFS_OAUTH_CLIENT_ID
              value: ""
            - name: AZURE_ABFS_OAUTH_SECRET
              value: ""
            - name: AZURE_ABFS_OAUTH_ENDPOINT
              value: ""
            - name: AZURE_WASB_ACCESS_KEY
              value: ""

        # Trino (Query Engine)
        - name: trino
          image: release.daocloud.io/dac/trino:latest
          ports:
            - containerPort: 8080
              name: trino
          env:
            - name: POSTGRES_USER
              value: dac
            - name: POSTGRES_PASSWORD
              value: dacpass
            - name: POSTGRES_DB
              value: dac_sandbox
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          volumeMounts:
            - name: trino-etc
              mountPath: /etc/trino
              readOnly: true
            - name: trino-data
              mountPath: /data/trino

        # Nextcloud DB (MariaDB)
        - name: nextcloud-db
          image: release.daocloud.io/dac/mariadb:11
          ports:
            - containerPort: 3306
              name: nextcloud-db
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: nextcloudroot
            - name: MYSQL_DATABASE
              value: nextcloud
            - name: MYSQL_USER
              value: nextcloud
            - name: MYSQL_PASSWORD
              value: nextcloudpass
          volumeMounts:
            - name: nextcloud-db-data
              mountPath: /var/lib/mysql

        # Nextcloud (Apache)
        - name: nextcloud
          image: release.daocloud.io/dac/nextcloud:29-apache
          ports:
            - containerPort: 80
              name: nextcloud
          env:
            - name: MYSQL_HOST
              value: 127.0.0.1
            - name: MYSQL_DATABASE
              value: nextcloud
            - name: MYSQL_USER
              value: nextcloud
            - name: MYSQL_PASSWORD
              value: nextcloudpass
            - name: NEXTCLOUD_ADMIN_USER
              value: admin
            - name: NEXTCLOUD_ADMIN_PASSWORD
              value: adminpass
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: "localhost 127.0.0.1 dac-sandbox-host"
          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html

        # Odoo DB (Postgres port=5434 to avoid conflict)
        - name: odoo-db
          image: release.daocloud.io/dac/postgres:16
          args: ["-c", "port=5434"]
          ports:
            - containerPort: 5434
              name: odoo-db
          env:
            - name: POSTGRES_USER
              value: odoo
            - name: POSTGRES_PASSWORD
              value: odoopass
            - name: POSTGRES_DB
              value: postgres
          volumeMounts:
            - name: odoo-db-data
              mountPath: /var/lib/postgresql/data

        # Odoo
        - name: odoo
          image: release.daocloud.io/dac/odoo:17
          ports:
            - containerPort: 8069
              name: odoo
          env:
            - name: HOST
              value: 127.0.0.1
            - name: PORT
              value: "5434"
            - name: USER
              value: odoo
            - name: PASSWORD
              value: odoopass
          volumeMounts:
            - name: odoo-data
              mountPath: /var/lib/odoo

        # Gitea (SQLite)
        - name: gitea
          # Build & push this image in your CI/registry, with ZEYSI_REPO_URL baked in:
          #   docker build -t <YOUR_REGISTRY>/dac/sandbox-gitea:seed \
          #     --build-arg ZEYSI_REPO_URL=<git-url> --build-arg ZEYSI_REPO_REF=main \
          #     -f sandbox/apps/gitea/Dockerfile sandbox/apps/gitea
          image: release.daocloud.io/dac/sandbox-gitea:seed
          imagePullPolicy: Always
          # The upstream gitea image uses s6, which writes a lock file under the current
          # working directory (e.g. .s6-svscan/lock). Run from a writable dir.
          workingDir: /tmp
          ports:
            - containerPort: 3000
              name: gitea
          env:
            - name: GITEA_URL
              value: http://127.0.0.1:3000
            - name: GITEA_ADMIN_USER
              value: giteaadmin
            - name: GITEA_ADMIN_PASSWORD
              value: giteaadminpass
            - name: GITEA_ADMIN_EMAIL
              value: admin@example.com
            - name: GITEA_REPO_NAME
              value: zeysi-apiserver
            - name: GITEA_SEED_SRC
              value: /seed/src
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__server__DOMAIN
              value: dac-sandbox-host
            - name: GITEA__server__ROOT_URL
              value: http://dac-sandbox-host:3000/
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
          volumeMounts:
            - name: gitea-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp