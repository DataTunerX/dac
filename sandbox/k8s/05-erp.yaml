apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dac-sandbox-erpnext
  namespace: dac-sandbox
spec:
  serviceName: dac-sandbox-erpnext-headless
  replicas: 1
  selector:
    matchLabels:
      app: dac-sandbox-erpnext
  template:
    metadata:
      labels:
        app: dac-sandbox-erpnext
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        # Ephemeral storage only (no PVC). All data will be reset when Pod is recreated.
        - name: db-data
          emptyDir: {}
        - name: redis-queue-data
          emptyDir: {}
        - name: sites
          emptyDir: {}
        - name: logs
          emptyDir: {}

      initContainers:
        # 1) configurator: 写入 common_site_config.json 等全局配置
        - name: configurator
          image: release.daocloud.io/dac/erpnext:v15.95.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              cd /home/frappe/frappe-bench

              # Fresh emptyDir has no sites/common_site_config.json.
              # bench set-config expects the file to exist (it reads then updates it).
              mkdir -p sites
              if [ ! -f sites/common_site_config.json ]; then
                echo '{}' > sites/common_site_config.json
              fi

              ls -1 apps > sites/apps.txt

              bench set-config -g db_host "${DB_HOST}"
              bench set-config -gp db_port "${DB_PORT}"
              bench set-config -g redis_cache "redis://${REDIS_CACHE}"
              bench set-config -g redis_queue "redis://${REDIS_QUEUE}"
              bench set-config -g redis_socketio "redis://${REDIS_QUEUE}"
              bench set-config -gp socketio_port "${SOCKETIO_PORT}"

              echo "[configurator] wrote common_site_config.json"
          env:
            - name: DB_HOST
              value: 127.0.0.1
            - name: DB_PORT
              value: "3306"
            - name: REDIS_CACHE
              value: 127.0.0.1:6379
            - name: REDIS_QUEUE
              value: 127.0.0.1:6380
            - name: SOCKETIO_PORT
              value: "9000"
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs

      containers:
        - name: db
          image: release.daocloud.io/dac/mariadb:10.6
          ports:
            - containerPort: 3306
              name: mysql
          # Do NOT override `command:` to mysqld, otherwise entrypoint won't drop root.
          # Keep image entrypoint (docker-entrypoint.sh) and pass flags via args.
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --skip-character-set-client-handshake
            - --skip-innodb-read-only-compressed
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: admin
            - name: MARIADB_ROOT_PASSWORD
              value: admin
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 --password=$MYSQL_ROOT_PASSWORD --silent"]
            initialDelaySeconds: 5
            periodSeconds: 5

        - name: redis-cache
          image: release.daocloud.io/dac/redis:6.2-alpine
          args: ["--port", "6379"]
          ports:
            - containerPort: 6379
              name: redis-cache

        - name: redis-queue
          image: release.daocloud.io/dac/redis:6.2-alpine
          args: ["--port", "6380"]
          ports:
            - containerPort: 6380
              name: redis-queue
          volumeMounts:
            - name: redis-queue-data
              mountPath: /data

        # Bootstrap (create site + seed demo data).
        # NOTE: must NOT be an initContainer, otherwise it deadlocks waiting for db/redis.
        - name: bootstrap
          image: release.daocloud.io/dac/erpnext:v15.95.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              cd /home/frappe/frappe-bench

              echo "[bootstrap] waiting for mariadb..."
              for i in $(seq 1 300); do
                if mysqladmin ping -h 127.0.0.1 --password="${MYSQL_ROOT_PASSWORD}" --silent >/dev/null 2>&1; then
                  break
                fi
                sleep 1
              done

              echo "[bootstrap] waiting for redis..."
              for i in $(seq 1 300); do
                if redis-cli -h 127.0.0.1 -p 6379 PING >/dev/null 2>&1 && \
                   redis-cli -h 127.0.0.1 -p 6380 PING >/dev/null 2>&1; then
                  break
                fi
                sleep 1
              done

              echo "[bootstrap] waiting for sites/common_site_config.json..."
              for i in $(seq 1 120); do
                if [ -s "sites/common_site_config.json" ]; then
                  break
                fi
                sleep 1
              done

              if [ ! -f "sites/frontend/site_config.json" ]; then
                echo "[bootstrap] creating site: frontend"
                bench new-site \
                  --mariadb-user-host-login-scope='%' \
                  --admin-password="${ADMIN_PASSWORD}" \
                  --db-root-username=root \
                  --db-root-password="${MYSQL_ROOT_PASSWORD}" \
                  --install-app erpnext \
                  --set-default frontend
              else
                echo "[bootstrap] site already exists: frontend"
              fi

              echo "[bootstrap] seeding demo data if needed..."
              PYTHON_CODE="$(printf '%s\n' \
                'import frappe' \
                'from frappe.utils import add_days, getdate' \
                'from erpnext.setup.setup_wizard.setup_wizard import setup_complete' \
                'from erpnext.setup.demo import setup_demo_data' \
                '' \
                'today = getdate()' \
                'fy_start = add_days(today, -365)' \
                'fy_end = today' \
                '' \
                'if frappe.db.count(\"Company\") == 0:' \
                '    args = {' \
                '        \"company_name\": \"DAC Test Company\",' \
                '        \"company_abbr\": \"DAC\",' \
                '        \"country\": \"United States\",' \
                '        \"currency\": \"USD\",' \
                '        \"chart_of_accounts\": \"Standard\",' \
                '        \"domain\": \"Manufacturing\",' \
                '        \"fy_start_date\": str(fy_start),' \
                '        \"fy_end_date\": str(fy_end),' \
                '    }' \
                '    setup_complete(args)' \
                '' \
                'if not frappe.db.get_single_value(\"Global Defaults\", \"demo_company\"):' \
                '    setup_demo_data()' \
                '' \
                'frappe.db.commit()' \
                'print(\"demo seed done\")' \
              )"
              bench --site frontend execute "$PYTHON_CODE"

              echo "[bootstrap] done; sleeping"
              sleep infinity
          env:
            - name: ADMIN_PASSWORD
              value: admin
            - name: MYSQL_ROOT_PASSWORD
              value: admin
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs

        - name: backend
          image: release.daocloud.io/dac/erpnext:v15.95.0
          ports:
            - containerPort: 8000
              name: backend
          env:
            - name: DB_HOST
              value: 127.0.0.1
            - name: DB_PORT
              value: "3306"
            - name: MYSQL_ROOT_PASSWORD
              value: admin
            - name: MARIADB_ROOT_PASSWORD
              value: admin
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs

        - name: websocket
          image: release.daocloud.io/dac/erpnext:v15.95.0
          ports:
            - containerPort: 9000
              name: websocket
          command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
          env:
            - name: FRAPPE_REDIS_CACHE
              value: redis://127.0.0.1:6379
            - name: FRAPPE_REDIS_QUEUE
              value: redis://127.0.0.1:6380
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs

        - name: queue-short
          image: release.daocloud.io/dac/erpnext:v15.95.0
          command: ["bench", "worker", "--queue", "short,default"]
          env:
            - name: FRAPPE_REDIS_CACHE
              value: redis://127.0.0.1:6379
            - name: FRAPPE_REDIS_QUEUE
              value: redis://127.0.0.1:6380
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs

        - name: queue-long
          image: release.daocloud.io/dac/erpnext:v15.95.0
          command: ["bench", "worker", "--queue", "long,default,short"]
          env:
            - name: FRAPPE_REDIS_CACHE
              value: redis://127.0.0.1:6379
            - name: FRAPPE_REDIS_QUEUE
              value: redis://127.0.0.1:6380
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs

        - name: scheduler
          image: release.daocloud.io/dac/erpnext:v15.95.0
          command: ["bench", "schedule"]
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs

        - name: frontend
          image: release.daocloud.io/dac/erpnext:v15.95.0
          ports:
            - containerPort: 8080
              name: http
          command: ["nginx-entrypoint.sh"]
          env:
            - name: BACKEND
              value: 127.0.0.1:8000
            - name: SOCKETIO
              value: 127.0.0.1:9000
            - name: FRAPPE_SITE_NAME_HEADER
              value: frontend
            - name: UPSTREAM_REAL_IP_ADDRESS
              value: 127.0.0.1
            - name: UPSTREAM_REAL_IP_HEADER
              value: X-Forwarded-For
            - name: UPSTREAM_REAL_IP_RECURSIVE
              value: "off"
            - name: PROXY_READ_TIMEOUT
              value: "120"
            - name: CLIENT_MAX_BODY_SIZE
              value: 50m
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
            - name: logs
              mountPath: /home/frappe/frappe-bench/logs

---
apiVersion: v1
kind: Service
metadata:
  name: dac-sandbox-erpnext-headless
  namespace: dac-sandbox
spec:
  clusterIP: None
  selector:
    app: dac-sandbox-erpnext
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: dac-sandbox-erpnext
  namespace: dac-sandbox
spec:
  type: ClusterIP
  selector:
    app: dac-sandbox-erpnext
  ports:
    - name: http
      port: 80
      targetPort: 8080