# GitLab 一次性灌种子 Job：等 GitLab ready → ROPC 拿 root token → 创建 project → push 示例代码
# 镜像构建期已 clone test-code + saleor 到 /seed/code/，entrypoint 会依次 push 全部项目
# 依赖：StatefulSet 的 gitlab 容器通过 GITLAB_OMNIBUS_CONFIG 把 root 密码固定为 dacpassword。
#
# GitLab 首次 reconfigure 需要 3-5 分钟，entrypoint 内置最长 600s 等待逻辑，
# Job 这里给 backoffLimit=10 让 Job 控制器有充足的重试机会。
apiVersion: batch/v1
kind: Job
metadata:
  name: dac-sandbox-gitlab-seed
  namespace: dac-sandbox
  labels:
    app.kubernetes.io/name: dac-sandbox
    app.kubernetes.io/component: gitlab-seed
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: release.daocloud.io/dac/sandbox-gitlab-seed:v0.11.0
          # sandbox 是开发态，同 tag 反复迭代，必须 Always 否则节点缓存老镜像
          imagePullPolicy: Always
          env:
            - name: GITLAB_URL
              value: "http://gitlab.dac-sandbox.svc.cluster.local:8929"
            - name: GITLAB_ROOT_PASSWORD
              value: "dacpassword"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
