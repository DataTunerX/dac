apiVersion: v1
data:
  config.yaml: |
    agent_registry:
      orchestrator_base_url: "http://orchestrator-registry.dac.svc.cluster.local:8000"
      biz_orchestrator_base_url: "http://biz-orchestrator-registry.dac.svc.cluster.local:8000"
      timeout: 10s

    server:
      host: "0.0.0.0"
      port: 8080
      mode: "release"
      read_timeout: 60s
      write_timeout: 60s
      max_request_body_size: 10485760

    log:
      level: "info"
      format: "json"
      output: "stdout"
      add_source: false

    observability:
      enable_metrics: false
      metrics_port: 9090
      enable_tracing: false
      tracing_endpoint: ""

    jwt:
      secret: "dac-jwt-secret-change-me"
      timeout: "15m"
      max_refresh: "168h"
      cookie_secure: false
      cookie_domain: ""

    routing_agent:
      base_url: "http://biz-routing-agent:10100"
      timeout: 300s
      session_timeout: 30m

    data_services:
      base_url: "http://data-services:8000"

    # skill-hub base URL is hardcoded in apiserver to
    # http://skill-hub.dac.svc.cluster.local:8000; only timeout is configurable here.
    skill_hub:
      timeout: 120s

    # TDB pipeline controller (runs outside DAC, on the fw-worker cluster).
    # `targets` is DAC's copy of the controller's domain-config allowlist: the
    # controller exposes no endpoint for it. Each gateway is the same TDB the
    # matching domain skill agent queries, so ingestion and Q&A share one TDB.
    # Keys under targets/defaults are snake_case because they are passed to the
    # apiserver config verbatim.
    tdb_pipeline:
      base_url: "http://tdb-pipeline-controller.tdb-pipeline.svc.cluster.local:8080"
      caller_id: "dac"
      timeout: "60s"
      llm_profiles:
        - local
        - openai
      images:
        - 10.124.48.120/tdb/pipeline-runner:v0.4.0-rc
        - 10.124.48.120/tdb/pipeline-runner:v0.4.0-rc-openai
      skill:
        agent:
          auto_create: true
          expert_agent_max_steps: "30"
          expert_llm: gpt-5.6-luna
          namespace: default
          orchestrator_agent_max_loops: "2"
          planner_llm: gpt-5.6-luna
        auto_publish: true
        namespace: default
      defaults:
        attempt_status_prefix: s3://tdb-archaeology-pipeline/tdb/pipeline/jobs/attempt-status
        collection: academic_papers
        image: 10.124.48.120/tdb/pipeline-runner:v0.4.0-rc-openai
        llm_profile: openai
        runs_prefix: s3://tdb-archaeology-pipeline/tdb/pipeline/runs
        status_prefix: s3://tdb-archaeology-pipeline/tdb/pipeline/jobs/status
      targets:
        - collection: academic_papers
          domain: archeology
          domain_profile: pipeline/profiles/archeology.v2.json
          gateway_url: http://10.124.48.91:8996
          id: archeology_papers_test
          label: 考古学（论文测试库，隔离）
          skill_agent: tdb-archeology-papers-test-qa

        - domain: archeology
          domain_profile: pipeline/profiles/archeology.v2.json
          gateway_url: http://10.124.48.91:8989
          id: archeology
          label: 考古学
          skill_agent: tdb-archeology-qa
        - domain: history
          domain_profile: pipeline/profiles/history.v2.json
          gateway_url: http://10.124.48.91:8990
          id: history
          label: 历史学
          skill_agent: tdb-history-qa
        - domain: art_history
          domain_profile: pipeline/profiles/art_history.v2.json
          gateway_url: http://10.124.48.91:8991
          id: art_history
          label: 艺术史
          skill_agent: tdb-art-history-qa
        - domain: anthropology_sociology
          domain_profile: pipeline/profiles/anthropology_sociology.v2.json
          gateway_url: http://10.124.48.91:8992
          id: anthropology_sociology
          label: 人类学与社会学
          skill_agent: tdb-anthropology-sociology-qa
        - domain: philosophy_theory
          domain_profile: pipeline/profiles/philosophy_theory.v2.json
          gateway_url: http://10.124.48.91:8993
          id: philosophy_theory
          label: 哲学与理论
          skill_agent: tdb-philosophy-theory-qa
        - domain: geo_environment
          domain_profile: pipeline/profiles/geo_environment.v2.json
          gateway_url: http://10.124.48.91:8994
          id: geo_environment
          label: 地理与环境
          skill_agent: tdb-geo-environment-qa
        - domain: literature_humanities
          domain_profile: pipeline/profiles/literature_humanities.v2.json
          gateway_url: http://10.124.48.91:8995
          id: literature_humanities
          label: 文学与人文
          skill_agent: tdb-literature-humanities-qa
        - domain: wwybsj
          domain_profile: pipeline/profiles/wwybsj.v2.json
          gateway_url: http://10.124.48.91:8997
          id: wwybsj
          label: 文物艺术博物馆
          skill_agent: tdb-wwybsj-answering
    database:
      driver: "mysql"
      host: "mysql.dac.svc.cluster.local"
      port: 3306
      user: "root"
      password: "changeme"
      database: "dac_db"
      max_open_conns: 25
      max_idle_conns: 5
      conn_max_lifetime: 5m
  model.conf: |
    [request_definition]
    r = sub, obj, act

    [policy_definition]
    p = sub, obj, act

    [role_definition]
    g = _, _

    [policy_effect]
    e = some(where (p.eft == allow))

    [matchers]
    m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && (p.act == "*" || r.act == p.act)
  policy.csv: |
    p, admin, *, *
    p, user, /api/v1/users/me, GET
    p, user, /api/v1/chat/conversations, GET
    p, user, /api/v1/chat/conversations/*, GET
    p, user, /api/v1/agents, GET
    p, user, /api/v1/descriptors, GET
    p, user, /api/v1/namespaces, GET
    p, user, /api/v1/namespaces/*/agents, GET
    p, user, /api/v1/namespaces/*/agents/*, GET
    p, user, /api/v1/namespaces/*/descriptors, GET
    p, user, /api/v1/namespaces/*/descriptors/*, GET
    p, user, /api/v1/namespaces/*/configmaps, GET
    p, user, /api/v1/namespaces/*/configmaps/*, GET
    p, user, /api/v1/semantic-groups, GET
    p, user, /api/v1/semantic-groups/*, GET
    p, user, /api/v1/discovery/scans, GET
    p, user, /api/v1/discovery/scans/*, GET
    p, user, /api/v1/knowledge-graph/*, POST
    p, user, /api/v1/skills/namespaces, GET
    p, user, /api/v1/skills/namespaces/*/exists, GET
    p, user, /api/v1/skills/namespaces/*/skills, GET
    p, user, /api/v1/skills/namespaces/*/skills/*/download, GET
    p, user, /api/v1/tdb-pipeline/options, GET
    p, user, /api/v1/tdb-pipeline/runs, GET
    p, user, /api/v1/tdb-pipeline/runs/*, GET
    p, user, /v1/chat/completions, POST

    g, admin, admin
    g, user, user
