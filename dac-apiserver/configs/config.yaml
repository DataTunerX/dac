# 本地开发配置
server:
  host: ""
  port: 8080
  mode: "debug"
  read_timeout: 10s
  write_timeout: 10s
  max_request_body_size: 64

log:
  level: "debug"
  format: "json"
  output: "stdout"
  file_path: ""
  add_source: true

observability:
  enable_metrics: false
  metrics_port: 9090
  enable_tracing: false
  tracing_endpoint: ""

# JWT 配置
jwt:
  secret: "dac-jwt-secret-key-for-development-please-change-in-production"
  timeout: 15m
  max_refresh: 168h
  cookie_secure: false
  cookie_domain: ""

# Routing Agent 配置
routing_agent:
  base_url: "http://10.17.0.41:30100"
  timeout: 30s
  session_timeout: 30m

# Data Services 配置
data_services:
  base_url: "http://10.17.0.41:22000" # Explicitly set based on doc examples
  timeout: 30s

# Semantic Grouper 配置（成员增删异步任务）
semantic_grouper:
  base_url: "http://localhost:8000"
  timeout: 60s

# Agent Registry 配置
agent_registry:
  orchestrator_base_url: "http://orchestrator-registry.dac.svc.cluster.local:8000"
  biz_orchestrator_base_url: "http://biz-orchestrator-registry.dac.svc.cluster.local:8000"
  timeout: 10s

# Skill Hub：地址硬编码为 dac/skill-hub Service，此处仅配置超时
skill_hub:
  timeout: 120s

# TDB Pipeline Controller 配置
# 控制器在 fw-worker 集群 tdb-pipeline 命名空间中运行，DAC 通过它异步提交入库任务。
# targets 是控制器 domain-config ConfigMap 允许列表在 DAC 侧的副本（控制器没有暴露该列表的接口），
# gateway_url 与各领域技能 Agent 查询的 TDB 网关保持一致，保证入库与问答使用同一个 TDB。
tdb_pipeline:
  base_url: "http://tdb-pipeline-controller.tdb-pipeline.svc.cluster.local:8080"
  caller_id: "dac"
  token: "" # 由 DAC_TDB_PIPELINE_TOKEN 注入
  timeout: 60s
  llm_profiles:
    - "local"
    - "openai"
  images:
    - "10.124.48.120/tdb/pipeline-runner:v0.4.0-rc"
    - "10.124.48.120/tdb/pipeline-runner:v0.4.0-rc-openai"
  defaults:
    collection: "academic_papers"
    image: "10.124.48.120/tdb/pipeline-runner:v0.4.0-rc-openai"
    llm_profile: "openai"
    runs_prefix: "s3://tdb-archaeology-pipeline/tdb/pipeline/runs"
    status_prefix: "s3://tdb-archaeology-pipeline/tdb/pipeline/jobs/status"
    attempt_status_prefix: "s3://tdb-archaeology-pipeline/tdb/pipeline/jobs/attempt-status"
  # 运行成功后自动为该目标发布 TDB 问答技能（幂等：技能已存在则跳过）
  skill:
    auto_publish: true
    namespace: "default"
    # 发布技能后自动创建加载该技能的技能 Agent（技能仅"可用"，Agent 才会"加载"）
    agent:
      auto_create: true
      namespace: "default"
      expert_llm: "gpt-5.6-luna"
      planner_llm: "gpt-5.6-luna"
      expert_agent_max_steps: "30"
      orchestrator_agent_max_loops: "2"
  targets:
    - id: "archeology"
      domain: "archeology"
      label: "考古学"
      gateway_url: "http://10.124.48.91:8989"
      domain_profile: "pipeline/profiles/archeology.v2.json"
      skill_agent: "tdb-archeology-qa"
    - id: "history"
      domain: "history"
      label: "历史学"
      gateway_url: "http://10.124.48.91:8990"
      domain_profile: "pipeline/profiles/history.v2.json"
      skill_agent: "tdb-history-qa"
    - id: "art_history"
      domain: "art_history"
      label: "艺术史"
      gateway_url: "http://10.124.48.91:8991"
      domain_profile: "pipeline/profiles/art_history.v2.json"
      skill_agent: "tdb-art-history-qa"
    - id: "anthropology_sociology"
      domain: "anthropology_sociology"
      label: "人类学与社会学"
      gateway_url: "http://10.124.48.91:8992"
      domain_profile: "pipeline/profiles/anthropology_sociology.v2.json"
      skill_agent: "tdb-anthropology-sociology-qa"
    - id: "philosophy_theory"
      domain: "philosophy_theory"
      label: "哲学与理论"
      gateway_url: "http://10.124.48.91:8993"
      domain_profile: "pipeline/profiles/philosophy_theory.v2.json"
      skill_agent: "tdb-philosophy-theory-qa"
    - id: "geo_environment"
      domain: "geo_environment"
      label: "地理与环境"
      gateway_url: "http://10.124.48.91:8994"
      domain_profile: "pipeline/profiles/geo_environment.v2.json"
      skill_agent: "tdb-geo-environment-qa"
    - id: "literature_humanities"
      domain: "literature_humanities"
      label: "文学与人文"
      gateway_url: "http://10.124.48.91:8995"
      domain_profile: "pipeline/profiles/literature_humanities.v2.json"
      skill_agent: "tdb-literature-humanities-qa"
    - id: "wwybsj"
      domain: "wwybsj"
      label: "文物艺术博物馆"
      gateway_url: "http://10.124.48.91:8997"
      domain_profile: "pipeline/profiles/wwybsj.v2.json"
      skill_agent: "tdb-wwybsj-answering"
    - id: "archeology_papers_test"
      domain: "archeology"
      label: "考古学（论文测试库，隔离）"
      gateway_url: "http://10.124.48.91:8996"
      domain_profile: "pipeline/profiles/archeology.v2.json"
      # Paper batches keep the papers collection; every other target
      # defaults its collection to the target domain.
      collection: "academic_papers"
      test: true

# 数据库配置
database:
  driver: "mysql"
  host: "127.0.0.1"
  port: 3306
  user: "dac_user"
  password: "dac_pass"
  database: "dac_db"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m
