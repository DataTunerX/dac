# 本地开发配置
server:
  host: ""
  port: 8080
  mode: "debug"
  read_timeout: 10s
  write_timeout: 10s
  max_request_body_size: 64

log:
  level: "debug"
  format: "json"
  output: "stdout"
  file_path: ""
  add_source: true

observability:
  enable_metrics: false
  metrics_port: 9090
  enable_tracing: false
  tracing_endpoint: ""

# JWT 配置
jwt:
  secret: "dac-jwt-secret-key-for-development-please-change-in-production"
  timeout: 15m
  max_refresh: 168h
  cookie_secure: false
  cookie_domain: ""

# Routing Agent 配置
routing_agent:
  base_url: "http://10.17.0.41:30100"
  timeout: 30s
  session_timeout: 30m

# Data Services 配置
data_services:
  base_url: "http://10.17.0.41:22000" # Explicitly set based on doc examples
  timeout: 30s

# Semantic Grouper 配置（成员增删异步任务）
semantic_grouper:
  base_url: "http://localhost:8000"
  timeout: 60s

# Agent Registry 配置
agent_registry:
  orchestrator_base_url: "http://orchestrator-registry.dac.svc.cluster.local:8000"
  biz_orchestrator_base_url: "http://biz-orchestrator-registry.dac.svc.cluster.local:8000"
  timeout: 10s

# Skill Hub：地址硬编码为 dac/skill-hub Service，此处仅配置超时
skill_hub:
  timeout: 120s

# 数据库配置
database:
  driver: "mysql"
  host: "127.0.0.1"
  port: 3306
  user: "dac_user"
  password: "dac_pass"
  database: "dac_db"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m
