# 本地 RBAC 测试配置（使用本机 MySQL 3307）
server:
  host: "127.0.0.1"
  port: 8080
  mode: "debug"
  read_timeout: 30s
  write_timeout: 30s
  max_request_body_size: 64

log:
  level: "debug"
  format: "json"
  output: "stdout"
  file_path: ""
  add_source: false

observability:
  enable_metrics: false
  metrics_port: 9090
  enable_tracing: false
  tracing_endpoint: ""

# JWT 配置
jwt:
  secret: "dac-test-secret-key-for-rbac-please-change-1234567890"
  timeout: 24h
  max_refresh: 168h
  cookie_secure: false
  cookie_domain: ""

# Routing Agent 配置
routing_agent:
  base_url: "http://10.17.0.41:30100"
  timeout: 30s
  session_timeout: 30m

# Data Services 配置
data_services:
  base_url: "http://10.17.0.41:22000"
  timeout: 30s

# Semantic Grouper 配置
semantic_grouper:
  base_url: "http://localhost:8000"
  timeout: 60s

# Agent Registry 配置
agent_registry:
  orchestrator_base_url: "http://orchestrator-registry.dac.svc.cluster.local:8000"
  biz_orchestrator_base_url: "http://biz-orchestrator-registry.dac.svc.cluster.local:8000"
  timeout: 10s

# Skill Hub 配置
skill_hub:
  timeout: 120s

# 数据库配置（本机 MySQL 3307，root/123）
database:
  driver: "mysql"
  host: "127.0.0.1"
  port: 3307
  user: "root"
  password: "123"
  database: "dac_rbac_test"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

# 首个管理员引导（测试环境使用强口令覆盖内置默认值）
bootstrap:
  admin: "admin"
  password: "changeme"