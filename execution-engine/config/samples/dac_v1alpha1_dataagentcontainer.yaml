apiVersion: dac.dac.io/v1alpha1
kind: DataAgentContainer
metadata:
  name: dac-satellite
  namespace: default
spec:
  dacType: "ds"
  dataPolicy:
    dataSourceType: "SemanticDomain"
    semanticGroupID: ""
    sourceNameSelector: ["dd-minio-test"]
  agentCard:
    name: "SatelliteCommunicationAnalyst"
    description: "我是全球通信卫星产业发展的『年度情报分析师』，专注于解读年度卫星部署动态、技术演进趋势与各国战略布局，为相关决策提供基于数据的深度洞察。\n\n我能为你解决的问题：\n1. **年度部署全景分析**：帮你梳理全球年度通信卫星发射的总体数量、国家/地区分布及增长驱动因素，清晰掌握市场格局与活跃主体。\n2. **军用通信卫星发展追踪**：帮你分析各国军用通信系统的升级换代进程、在轨能力增强情况以及下一代体系（如分级式防护体系、Skynet-6）的规划论证，把握国防通信能力建设方向。\n3. **民商用通信卫星创新解读**：帮你洞察低轨星座（如IridiumNEXT）、高通量卫星（如ViaSat-2、Epic系列）、全电推进平台（如Eurostar-3000EOR）等颠覆性技术潮流的部署进展、技术特点与新兴应用（如机载宽带），识别商业创新与市场机会。\n4. **区域与国家深度剖析**：帮你深入分析美国、欧洲、俄罗斯、日本、印度等主要国家/地区的年度发射情况、重点卫星项目（如WGS-9、MUOS-5、SmallGEO、GSat-9）及其背后的产业战略调整（如频谱政策、5G融合）。\n5. **采购与新兴市场案例研究**：帮你了解巴西、阿尔及利亚等通过采购方式部署卫星的典型案例，分析其战略意图与合作模式。\n\n何时找我 & 我的服务承诺：\n- **找我时机**：当需要获取关于特定年份（如2017年）全球通信卫星发展的结构化、多维度分析报告时；当需要对比不同国家在军用或民商用领域的发展策略与技术路径时；当需要评估低轨星座、高通量卫星等特定技术趋势的年度进展与影响时。\n- **我能保证**：我确保提供的信息基于公开的年度综述数据，分析视角覆盖部署统计、技术解析与战略研判，输出内容结构清晰、重点突出。\n- **协作方式**：通过调用我的`analyze-annual-report`技能，输入年份与关注领域，我将返回该年度的核心发展分析。\n\n典型业务场景演示：\n当一家航天投资机构需要评估2017年全球低轨通信星座的投资热度时，我会：1) 汇总并分析该年度低轨星座的主要部署事件（如IridiumNEXT的批量发射完成），2) 对比其他高通量卫星系统的进展（如ViaSat-2发射创容量记录），3) 指出技术特点（如全电推进验证）与市场应用方向（如机载宽带），4) 最终形成关于该领域年度创新活力与竞争格局的简明报告。"
    skills:
      - id: "analyze-annual-report"
        name: "Analyze Annual Satellite Communication Report"
        description: "生成指定年份的全球通信卫星发展年度综述分析。业务目的：为战略规划、市场研究或投资分析提供结构化的年度发展概览与深度洞察。输入：目标年份（如2017）、可选关注领域（如‘军用’、‘民商用’、‘美国’、‘低轨星座’）。输出：包含年度总体部署情况、主要国家/地区分析、关键技术趋势、典型案例及核心结论的结构化分析报告。主要被战略规划Agent、市场研究Agent和投资分析Agent调用。"
        tags:
          - "satellite"
          - "communication"
          - "market-analysis"
          - "annual-report"
        examples:
          - "请分析2017年全球通信卫星发展情况，重点关注美国的民商用领域和低轨星座进展。"
  orchestratorAgentMaxLoops: "2"
  expertAgentMaxSteps: "3"
  model:
    plannerLLM: "llm-deepseek-v32"
    expertLLM: "llm-deepseek-v32"

