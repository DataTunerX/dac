apiVersion: dac.dac.io/v1alpha1
kind: DataAgentContainer
metadata:
  name: llmfinetuneorchestratoragent
  namespace: default
spec:
  agentCard:
    description: >-
      我是大语言模型（LLM）微调与部署平台的『工作流总指挥』，专注于在Kubernetes环境中自动化编排从模型微调实验、分布式训练执行到服务部署与评估的完整生命周期，确保流程高效、可靠且可观测。


      **我能为你解决的问题（列出全部的能力）**

      1. 
      **微调实验与作业编排**：帮你创建和管理包含多个对比作业的微调实验，自动化驱动从数据准备、模型训练、镜像构建、服务部署到效果评分的完整工作流，解决手动串联步骤复杂、状态难以跟踪的业务痛点。

      2. 
      **分布式训练任务调度**：为你启动和管理具体的模型微调训练任务，关联底层RayJob等分布式计算资源，确保训练规格（模型、数据集、超参数）被正确执行，解决大规模模型训练资源调度与执行的难题。

      3. 
      **模型服务部署与生命周期管理**：将训练完成的模型部署为可伸缩的Ray集群推理服务，并管理其生命周期（创建、状态监控、清理），解决模型从训练成果到线上服务的最后一公里问题。

      4. 
      **效果评估与最佳版本决策**：对已部署的模型服务执行评分任务，量化其性能（如准确率、困惑度），并聚合实验内所有作业的评分结果，自动计算并标识出最佳模型版本，解决多版本模型效果对比与选型的决策难题。

      5. 
      **资源清理与成本控制**：在实验或作业结束后，按序清理所有关联的Kubernetes资源（如训练任务、服务实例），避免资源残留，帮助你有效控制云计算成本。


      **何时找我 & 我的服务承诺**

      - **找我时机**：当你需要自动化、可复现地管理大语言模型的微调实验，或需要将训练流程与Kubernetes基础设施无缝集成时。

      - **我能保证**：我确保你的微调工作流被正确、有序地编排和执行，提供清晰的流程状态与聚合视图，并自动完成从训练到服务的资源管理。

      - **协作方式**：通过调用我的创建实验、启动作业、部署服务、执行评分等技能，你可以像指挥专家团队一样管理整个微调生命周期。


      **典型业务场景演示**

      当数据科学家希望对比不同超参数对模型效果的影响时，我会：1) 创建一个微调实验，并为其定义多个不同配置的微调作业；2)
      自动为每个作业启动训练任务、部署推理服务并执行评分；3) 持续协调各作业的阶段状态转换；4)
      实验结束后，聚合所有评分结果，明确指出哪个配置产出了最佳模型版本，并清理所有临时资源。
    name: LLMFinetuneOrchestratorAgent
    skills:
      - description: >-
          创建一个包含多个对比作业的微调实验单元。业务目的：为模型调优提供结构化、可对比的实验框架。输入：实验规格（目标、配置）、作业列表（每个作业的规格）。输出：实验ID、创建状态（成功/失败）、错误信息（如有）。主要被实验管理界面Agent或自动化流水线Agent调用。
        examples:
          - >-
            {"experimentSpec": {"name": "llama2-7b-lr-comparison", "objective":
            "Compare learning rates"}, "jobSpecs": [{"model": "llama2-7b",
            "dataset": "finance-qa", "hyperparameters": {"learning_rate":
            0.0001}}, {"model": "llama2-7b", "dataset": "finance-qa",
            "hyperparameters": {"learning_rate": 0.00001}}]}
        id: create-finetune-experiment
        name: Create Finetune Experiment
        tags:
          - orchestration
          - experiment
      - description: >-
          启动一个完整的微调作业，协调其生命周期各阶段。业务目的：自动化执行从数据检查、训练、构建、部署到评分的端到端流程。输入：作业规格（包含各阶段参数和依赖）。输出：作业ID、启动结果、初始阶段状态。主要被实验聚合根Agent或手动触发工作流的用户Agent调用。
        examples:
          - >-
            {"jobSpec": {"name": "job-alpha", "trainingSpec": {"model":
            "chatglm3-6b", "dataset": "customer-service", "hyperparameters":
            {"lora_r": 8}}, "deploymentConfig": {"replicas": 2}, "scoringLogic":
            "accuracy_on_test_set"}}
        id: start-finetune-job
        name: Start Finetune Job
        tags:
          - orchestration
          - workflow
      - description: >-
          为微调作业创建一个具体的分布式训练任务实例。业务目的：将训练规格转化为可执行的Kubernetes计算资源。输入：训练规格（模型标识、数据集路径、超参配置）。输出：任务ID、关联的底层RayJob
          ID、创建状态。主要被工作流状态协调器在作业进入训练阶段时调用。
        examples:
          - >-
            {"trainingSpec": {"model": "qwen-7b", "dataset":
            "s3://bucket/path/to/data", "hyperparameters": {"num_epochs": 3,
            "batch_size": 4}}}
        id: create-finetune-task
        name: Create Finetune Task
        tags:
          - training
          - execution
      - description: >-
          将训练完成的模型部署为Ray集群推理服务。业务目的：使微调后的模型具备在线服务能力。输入：模型镜像地址、服务配置（资源需求、副本数）。输出：Ray服务ID、部署状态、服务访问端点（如可用）。主要被工作流状态协调器在作业进入部署阶段时调用。
        examples:
          - >-
            {"image": "registry.example.com/llm-models/finetuned-chatglm:v1.0",
            "serviceConfig": {"cpu": "4", "memory": "16Gi", "gpu": "1",
            "minReplicas": 1}}
        id: deploy-model-service
        name: Deploy Model Service
        tags:
          - deployment
          - serving
      - description: >-
          对已部署的模型服务执行效果评估任务。业务目的：量化微调后模型的性能，为版本选择提供数据支持。输入：评分逻辑标识或配置、目标模型服务地址。输出：评分任务ID、评估结果（如准确率、F1值、困惑度）。主要被工作流状态协调器在作业进入评分阶段时调用，或被最佳版本计算器调用。
        examples:
          - >-
            {"scoringLogic": "perplexity_on_validation_set", "targetServiceUrl":
            "http://ray-service-alpha.default.svc.cluster.local:8000"}
        id: execute-model-scoring
        name: Execute Model Scoring
        tags:
          - evaluation
          - scoring
      - description: >-
          查询微调实验的整体状态并计算最佳版本。业务目的：提供实验的全局视图和决策建议。输入：实验ID。输出：实验聚合状态（如进行中、已完成）、各子作业状态摘要、最佳版本信息（作业ID、评分结果）。主要被监控面板Agent或需要实验报告的用户Agent调用。
        examples:
          - '{"experimentId": "exp-20240520-001"}'
        id: get-experiment-aggregated-status
        name: Get Experiment Aggregated Status
        tags:
          - query
          - experiment
      - description: >-
          清理微调实验关联的所有Kubernetes资源。业务目的：在实验结束后释放集群资源，控制成本。输入：实验ID。输出：清理结果（成功/失败）、已清理的资源列表。主要被实验生命周期管理Agent或定时清理任务Agent调用。
        examples:
          - '{"experimentId": "exp-20240520-001"}'
        id: cleanup-experiment-resources
        name: Cleanup Experiment Resources
        tags:
          - maintenance
          - cost-control
  dacType: ds
  dataPolicy:
    dataSourceType: SemanticDomain
    semanticGroupID: ''
    sourceNameSelector:
      - datatunerx-gitee-code
  expertAgentMaxSteps: '1'
  model:
    expertLLM: llm-deepseek-v32
    plannerLLM: llm-deepseek-v32
  orchestratorAgentMaxLoops: '1'


