apiVersion: dac.dac.io/v1alpha1
kind: DataAgentContainer
metadata:
  name: dd-ecommerce-orchestration-agent
  namespace: default
spec:
  dacType: "ds"
  dataPolicy:
    dataSourceType: "SemanticDomain"
    semanticGroupID: ""
    sourceNameSelector: ["dd01-gitee-testcode"]
  agentCard:
    name: "EcommerceOrchestrationAgent"
    description: |
      I am the 'Master Orchestrator' of e-commerce transaction processes, focused on orchestrating complex cross-domain business workflows such as user selection, inventory locking, and order generation with atomicity and consistency principles, ensuring seamless flow from shopping cart to order fulfillment.

      Core business problems I can solve for you include:
      1. **One-stop Order Process Orchestration**: Handling the complete business chain from cart checkout to order generation. I coordinate user identity verification, product inventory locking, and order snapshot creation, ensuring the entire process either succeeds completely or rolls back entirely, preventing data inconsistencies like 'orders without inventory' or 'inventory deducted without orders'.
      2. **Post-payment Fulfillment Process Driving**: Handling critical business connections after successful payment. When receiving payment callbacks, I drive order status updates from 'pending payment' to 'paid', and execute final inventory deductions, ensuring payment results accurately and idempotently trigger subsequent warehouse shipping processes.
      3. **Order Cancellation Resource Coordination**: Handling order cancellation requests initiated by users or systems. I assess cancellation feasibility based on the order's current status (e.g., whether shipped) and coordinate the release of previously reserved inventory for that order, allowing inventory resources to return promptly for other transactions.

      **When to Contact Me & My Service Commitment**
      - **Contact Timing**: When you need to execute a complete transaction use case involving multiple business domains (user, product, order), such as when users click "Submit Order" for checkout, or when payment gateway callbacks notify successful payment.
      - **What I Guarantee**: I ensure business atomicity and eventual state consistency for cross-domain operations, making complex distributed businesses as reliable as local transactions through clear process orchestration and failure compensation mechanisms.
      - **Collaboration Method**: By calling my orchestration skills like `place-order`, `handle-payment`, `cancel-order`, and passing necessary business identifiers (like user ID, product list, order ID), I will return complete process execution results.
      - **What I Don't Handle**: I don't handle specific operations within single domains, such as directly creating user accounts, modifying product descriptions, or independently querying order details. These are responsibilities of respective domain experts.

      **Typical Business Scenario Demonstrations**
      1. **User Order Submission Scenario**: When a user clicks "Checkout" from the shopping cart, I will: 1) Verify with the user management domain whether the user ID is valid; 2) Request locking of specified quantity inventory for each item in the list from the product management domain; 3) Obtain current snapshot information (name, price) of products; 4) Call the order management domain service to create an order aggregate with "pending payment" status based on the above information; 5) Return the generated order ID and process success result to the frontend. If any step fails (e.g., insufficient inventory), executed operations (e.g., inventory locking) will be rolled back.
      2. **Payment Success Callback Scenario**: When the payment platform notifies that order 12345 payment succeeded, I will: 1) Check if this payment notification has been processed for this order (idempotency validation); 2) Drive the order management domain to update order 12345 status from 'pending payment' to 'paid'; 3) Drive the product management domain to finally deduct inventory reserved for order 12345; 4) Return processing success result, triggering subsequent logistics shipping processes.
    skills:
      - id: "place-order"
        name: "Place Order"
        description: |
          Orchestrate the complete order placement business process. Business Purpose: Transform user shopping cart selections into a formal pending payment order and ensure inventory is safely reserved.
          Typical Input: user ID, product list (containing product IDs and purchase quantities), shipping address information.
          Expected Output: Generated order ID, process execution status (success/failure), specific reasons for failure.
          Primarily called by frontend shopping cart Agent or checkout page Agent.
        tags:
          - "orchestration"
          - "order"
          - "inventory"
        examples:
          - |
            {
              "user_id": "U1001",
              "items": [
                {"product_id": "P5001", "quantity": 2},
                {"product_id": "P5003", "quantity": 1}
              ],
              "shipping_address": {
                "recipient": "张三",
                "phone": "13800138000",
                "province": "北京",
                "city": "北京市",
                "detail": "海淀区中关村大街1号"
              }
            }
      - id: "handle-payment"
        name: "Handle Payment Success"
        description: |
          Orchestrate the fulfillment process after payment confirmation. Business Purpose: Update order status and deduct actual inventory after payment confirmation, bridging payment and warehousing.
          Typical Input: Order ID, payment platform transaction ID, payment amount and payment time.
          Expected Output: Order status update result, inventory deduction result, overall processing status.
          Primarily called by payment gateway callback processing Agent or reconciliation Agent.
        tags:
          - "orchestration"
          - "payment"
          - "fulfillment"
        examples:
          - |
            {
              "order_id": "O202310240001",
              "payment_id": "PAY123456789",
              "amount": 299.00,
              "paid_at": "2023-10-24T14:30:00Z"
            }
      - id: "cancel-order"
        name: "Cancel Order Process"
        description: |
          Orchestrate order cancellation and resource release process. Business Purpose: Cancel orders according to business rules and release inventory resources associated with the order.
          Typical Input: Order ID, cancellation reason (user canceled/system timeout, etc.).
          Expected Output: Order cancellation result (success/failure and reasons), inventory release result.
          Primarily called by user order center Agent or backend order management Agent.
        tags:
          - "orchestration"
          - "cancellation"
          - "inventory-release"
        examples:
          - |
            {
              "order_id": "O202310240002",
              "cancel_reason": "USER_CANCELED"
            }
  orchestratorAgentMaxLoops: "2"
  expertAgentMaxSteps: "3"
  model:
    plannerLLM: "llm-deepseek-v32"
    expertLLM: "llm-deepseek-v32"

---

apiVersion: dac.dac.io/v1alpha1
kind: DataAgentContainer
metadata:
  name: dac-ecommerce-transaction-agent
  namespace: default
spec:
  dacType: "ds"
  dataPolicy:
    dataSourceType: "SemanticDomain"
    semanticGroupID: ""
    sourceNameSelector: ["dd-dianshang-mysql"]
  agentCard:
    name: "EcommerceTransactionAgent"
    description: "我是电子商务交易闭环的『全链路协调专家』，专注于从商品展示、库存锁定到订单履约、状态流转及用户身份验证的端到端业务协同，确保在线交易顺畅、数据一致且体验可靠。\n\n我能为你解决的问题：\n1. **商品信息与库存协同管理**：帮你解决商品分类展示、实时库存查询与预留、以及价格信息同步的业务痛点。确保前端展示的商品状态、库存数量与后端真实数据一致，避免超卖或信息滞后。\n2. **订单全生命周期处理**：帮你处理从购物车到订单创建的复杂业务逻辑，包括生成订单快照、执行库存预留、管理订单状态机（如待支付、已支付、已发货、已完成、已取消）的合规流转，并处理与售后单（退款/退货）的关联。\n3. **用户身份与交易关联验证**：帮你验证下单用户的身份合法性，并确保订单、用户、商品三大核心数据域的关联关系准确无误，为交易安全与用户权限控制提供基础。\n\n何时找我 & 我的服务承诺：\n- **找我时机**：当需要创建一笔新订单、查询或修改商品库存状态、验证用户交易权限、或驱动订单状态向下一个合法环节（如支付后发货）流转时。\n- **我能保证**：我确保跨商品、订单、用户三大领域的业务操作是原子性且一致的，例如创建订单时会同步锁定库存，状态变更会遵循预定义的业务规则。\n- **协作方式**：通过调用我提供的商品查询、库存操作、订单创建、状态变更、用户验证等具体技能。\n\n典型业务场景演示：\n当用户准备结算购物车时，我会：1) 验证用户身份的有效性，2) 实时核验购物车中每个SKU的现货库存是否充足，3) 为可售商品创建预留库存记录，4) 基于商品当前价格生成不可变的订单项快照，5) 创建初始状态为『待支付』的完整订单聚合。当用户支付成功后，支付Agent会通知我，我将驱动订单状态从『待支付』合规变更为『已支付』，并触发后续的履约流程。"
    skills:
      - id: "query-product-with-stock"
        name: "Query Product with Stock"
        description: "查询商品详细信息及实时库存状态。业务目的：为商品展示或订单创建提供准确的可售性判断依据。输入：商品ID或SKU。输出：商品基础信息（名称、价格、分类）、上下架状态、现货库存与预留库存数量。主要被商品展示Agent和购物车Agent调用。"
        tags:
          - "product"
          - "inventory"
          - "catalog"
        examples:
          - "{\"product_id\": \"P12345\"}"
          - "{\"sku\": \"TSHIRT-RED-L\"}"
      - id: "reserve-stock-for-order"
        name: "Reserve Stock for Order"
        description: "为即将创建的订单预留指定数量的商品库存。业务目的：防止超卖，确保订单创建时商品可用。输入：商品SKU、需要预留的数量、关联的订单ID（或临时标识）。输出：预留操作结果（成功/失败）、预留后的现货与预留库存数量。主要被订单创建Agent调用。"
        tags:
          - "inventory"
          - "order"
          - "reservation"
        examples:
          - "{\"sku\": \"TSHIRT-BLUE-M\", \"quantity\": 2, \"order_token\": \"temp_order_abc123\"}"
      - id: "create-order-with-snapshot"
        name: "Create Order with Snapshot"
        description: "基于购物车信息创建新订单，并生成订单项快照。业务目的：将用户购物意图转化为一个具有完整业务上下文、数据不可变的正式订单。输入：用户ID、配送地址、支付方式、包含商品SKU、数量、快照价格的商品清单。输出：新创建的订单聚合详情，包括订单ID、总金额、初始状态（待支付）以及所有订单项的快照信息。主要被购物车结算Agent调用。"
        tags:
          - "order"
          - "fulfillment"
          - "transaction"
        examples:
          - "{\"user_id\": \"U1001\", \"shipping_address\": \"...\", \"items\": [{\"sku\": \"BOOK-001\", \"quantity\": 1, \"snapshot_price\": 29.99}]}"
      - id: "transition-order-state"
        name: "Transition Order State"
        description: "根据业务规则驱动订单状态机的合法流转。业务目的：管理订单生命周期，确保状态变更（如从已支付到已发货）符合预定义的业务流程。输入：订单ID、目标状态（如“shipped”、“cancelled”）、可选的变更原因。输出：状态变更结果（成功/失败）、变更后的订单状态、可能触发的后续动作提示（如释放库存）。主要被支付回调Agent、物流发货Agent、客服Agent调用。"
        tags:
          - "order"
          - "state-machine"
          - "workflow"
        examples:
          - "{\"order_id\": \"ORD20231124001\", \"target_state\": \"paid\"}"
          - "{\"order_id\": \"ORD20231124002\", \"target_state\": \"cancelled\", \"reason\": \"customer_request\"}"
      - id: "verify-user-for-transaction"
        name: "Verify User for Transaction"
        description: "验证指定用户身份及其进行交易的基本权限。业务目的：在关键业务操作（如下单）前确认用户合法性，保障交易安全。输入：用户ID或身份令牌。输出：验证结果（通过/不通过）、用户基本信息（如用户名、角色）、不通过时的原因。主要被订单创建Agent和支付发起Agent调用。"
        tags:
          - "user"
          - "authentication"
          - "authorization"
        examples:
          - "{\"user_id\": \"U1001\"}"
          - "{\"auth_token\": \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...\"}"
  orchestratorAgentMaxLoops: "2"
  expertAgentMaxSteps: "3"
  model:
    plannerLLM: "llm-deepseek-v32"
    expertLLM: "llm-deepseek-v32"

---

apiVersion: dac.dac.io/v1alpha1
kind: DataAgentContainer
metadata:
  name: semanticgroup-dianshang
  namespace: default
spec:
  dacType: "normal"
  dataPolicy:
    dataSourceType: "SemanticGroup"
    semanticGroupID: "bbea38ec-2d73-46b7-89c3-8931c35f5708"
    sourceNameSelector: []
  agentCard:
    name: "EcommerceTransactionOrchestrator"
    description: |
      我是电商交易流程的『总调度专家』，专注于以原子性和一致性为原则，编排用户选购、库存锁定、订单生成等跨领域复杂业务，确保从购物车到订单履约的完整链路顺畅无误。
      
      我能为你解决的核心业务问题包括：
      1. **一站式下单流程编排**：帮你处理从购物车结算到订单生成的完整业务链。我负责协调验证用户身份、锁定商品库存、创建订单快照，确保整个流程要么全部成功，要么全部回滚，避免产生‘有订单无库存’或‘扣了库存没订单’的数据不一致问题。
      2. **支付后履约流程驱动**：帮你处理支付成功后的关键业务衔接。当收到支付回调时，我会驱动订单状态从‘待支付’更新为‘已支付’，并执行库存的最终扣减，确保支付结果能准确、幂等地触发后续的仓储发货流程。
      3. **订单取消的资源协调**：帮你处理用户或系统发起的订单取消请求。我会根据订单的当前状态（如是否已发货）判断取消的可行性，并协调释放之前为这笔订单预占的商品库存，让库存资源能够及时回流，供其他交易使用。
      
      **何时找我 & 我的服务承诺**
      - **找我时机**：当你需要执行一个涉及多个业务领域（用户、商品、订单）的完整交易用例时，例如用户点击"提交订单"进行结算，或支付网关回调通知支付成功时。
      - **我能保证**：我确保跨领域操作的业务原子性和状态最终一致性，通过明确的流程编排和失败补偿机制，让复杂的分布式业务像本地事务一样可靠。
      - **协作方式**：通过调用我的 `place-order`、`handle-payment`、`cancel-order` 等编排技能，传入必要的业务标识（如用户ID、商品清单、订单ID），我将返回完整的流程执行结果。
      
      **典型业务场景演示**
      1. **用户提交订单场景**：当用户从购物车点击"结算"时，我会：1) 向用户管理域验证该用户ID是否有效；2) 向商品管理域请求锁定清单中每个商品的指定数量库存；3) 获取商品的当前快照信息（名称、价格）；4) 调用订单管理域的服务，基于以上信息创建一张状态为"待支付"的订单聚合；5) 将生成的订单ID和流程成功结果返回给前端。若任何一步失败（如库存不足），则已执行的操作（如库存锁定）将被回滚。
      2. **支付成功回调场景**：当支付平台通知订单12345支付成功时，我会：1) 检查该订单是否已处理过此支付通知（幂等性校验）；2) 驱动订单管理域将订单12345的状态从"待支付"更新为"已支付"；3) 驱动商品管理域将订单12345预占的库存进行最终扣减；4) 返回处理成功的结果，触发后续的物流发货流程。
    url: "http://192.168.xxx.xxx:20002/"
    provider: null
    version: "1.0.0"
    documentationUrl: null
    capabilities:
      streaming: "True"
      pushNotifications: "True"
      stateTransitionHistory: "False"
    authentication:
      credentials: null
      schemes:
        - "public"
    defaultInputModes:
      - "text"
      - "text/plain"
    defaultOutputModes:
      - "text"
      - "text/plain"
    skills:
      - id: "place-order"
        name: "Place Order"
        description: "编排一站式下单流程。业务目的：将购物车中的商品清单转化为一张状态为‘待支付’的订单，并确保用户身份有效、库存被成功锁定。典型输入：用户ID、商品SKU及数量清单、配送地址。预期输出：流程执行结果（成功/失败）、生成的订单ID、失败原因。主要被前端购物车Agent或结算页面Agent调用。"
        tags:
          - "orchestration"
          - "order"
          - "inventory"
        examples:
          - |
            {
              "user_id": "U1001",
              "items": [
                {"sku": "PROD001-RED-M", "quantity": 2},
                {"sku": "PROD002", "quantity": 1}
              ],
              "shipping_address": "上海市浦东新区..."
            }
        inputModes: null
        outputModes: null
      - id: "handle-payment"
        name: "Handle Payment"
        description: "驱动支付成功后的履约流程。业务目的：幂等地处理支付回调，更新订单状态并最终扣减库存，为发货流程铺路。典型输入：订单ID、支付交易号、支付金额、支付状态。预期输出：处理结果（成功/已处理/失败）、订单新状态、库存扣减详情。主要被支付网关回调处理Agent调用。"
        tags:
          - "orchestration"
          - "payment"
          - "fulfillment"
        examples:
          - |
            {
              "order_id": "ORD20231124001",
              "payment_transaction_id": "PAY123456789",
              "amount": 299.00,
              "status": "SUCCESS"
            }
        inputModes: null
        outputModes: null
      - id: "cancel-order"
        name: "Cancel Order"
        description: "协调订单取消及资源释放。业务目的：根据订单当前状态判断取消可行性，并协调释放预占的库存资源。典型输入：订单ID、取消原因（用户取消/超时未支付/系统异常）。预期输出：取消处理结果（成功/失败/不允许）、释放的库存详情。主要被订单超时管理Agent或用户前台Agent调用。"
        tags:
          - "orchestration"
          - "order"
          - "inventory"
        examples:
          - |
            {
              "order_id": "ORD20231124001",
              "cancel_reason": "USER_CANCELLED"
            }
        inputModes: null
        outputModes: null
  orchestratorAgentMaxLoops: "1"
  expertAgentMaxSteps: "1"
  model:
    plannerLLM: "llm-deepseek-v32"
    expertLLM: "llm-deepseek-v32"

