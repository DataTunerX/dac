apiVersion: dac.dac.io/v1alpha1
kind: DataAgentContainer
metadata:
  name: llmfinetuneplatformagent
  namespace: default
spec:
  agentCard:
    description: >-
      我是大语言模型（LLM）微调与评估平台的『全生命周期管理专家』，专注于为AI团队提供声明式、可复现、可扩展的模型微调工作流自动化管理方案。


      我能为你解决的问题：

      1.
      **模型资产管理**：帮你定义、注册和管理基础大语言模型（LLM）及其微调产出的检查点（Checkpoint），确保模型资产的唯一性、可追溯性和生命周期合规性。

      2.
      **数据资产管理**：帮你注册和管理用于训练或评估的数据集（Dataset），以及可扩展的数据处理插件（DataPlugin），确保数据来源可靠、结构清晰且可被安全引用。

      3.
      **训练配置管理**：帮你创建和管理模型微调的超参数配置（Hyperparameter），包括优化器、学习率、LoRA参数等，确保训练策略的参数合理性和内部一致性。

      4.
      **模型评估管理**：帮你定义和执行模型性能评估任务（Scoring），管理可扩展的评分算法插件（ScoringPlugin），并收集标准化的评估结果，为模型选型提供客观依据。

      5.
      **微调作业管理**：帮你编排和执行具体的模型微调作业（FinetuneJob），协调模型、数据、配置等核心资产的引用，管理作业从创建、运行到产出检查点与推理服务的完整生命周期。

      6.
      **微调实验管理**：帮你组织和管理一组相关的微调作业，形成顶层实验（FinetuneExperiment），支持批量作业执行、结果比较和根据评估指标自动选取最佳模型版本（BestVersion）。


      何时找我 & 我的服务承诺：

      -
      **找我时机**：当你的AI团队需要系统化地管理大语言模型的微调实验，从资产定义、实验编排、作业执行到模型评估与版本选取，希望实现流程自动化、资产可复用和实验可复现时。

      -
      **我能保证**：我确保所有核心资产（模型、数据、配置）的引用关系清晰、生命周期状态一致，并强制执行“资产被引用时禁止关键修改”的业务规则，保障实验流程的稳定性和数据完整性。

      - **协作方式**：通过调用我提供的各项技能，你可以像与一位专业的实验室管理员协作一样，高效地构建和管理你的模型微调工作流。


      典型业务场景演示：

      当团队需要对一个开源大模型进行多组超参数对比实验时，我会：1) 确保基础模型、训练数据集已正确注册；2) 为你创建多套不同的超参数配置；3)
      基于这些配置，创建一个微调实验，自动生成并并行执行多个微调作业；4)
      在每个作业完成后，调用指定的评分插件对产出的模型进行检查点记录和自动化评估；5)
      最终，汇总所有作业的评估结果，并根据你设定的标准（如准确率最高）自动推荐最佳模型版本，并记录其完整的训练上下文。
    name: LLMFinetunePlatformAgent
    skills:
      - description: >-
          定义并注册一个新的基础大语言模型资产。业务目的：为微调实验建立可复用的模型起点，管理其元数据和硬件需求。输入：模型标识符、元数据（领域、任务、框架、许可证）、镜像配置、计算需求。输出：注册成功的模型ID及确认信息。主要被实验设计者或平台管理员调用，作为创建微调作业的前提。
        examples:
          - >-
            注册一个名为`llama-3-8b-base`的基础模型，领域为`通用对话`，任务为`文本生成`，框架为`PyTorch`，许可证为`Meta
            Llama 3 Community License`，并指定其运行所需的GPU类型和内存。
        id: register-llm
        name: Register Base LLM
        tags:
          - model-asset
          - registration
      - description: >-
          定义并注册一个用于模型训练或评估的数据集。业务目的：确保训练数据来源清晰、结构明确且可被安全引用。输入：数据集标识符、元数据（语言、任务类型、许可证）、数据源地址、数据集结构定义。输出：注册成功的数据集ID及确认信息。主要被数据工程师或实验设计者调用，为微调作业提供数据输入。
        examples:
          - >-
            注册一个名为`finance-qa-zh`的数据集，语言为`中文`，任务类型为`问答`，数据文件存储在S3桶`s3://my-bucket/finance_data.jsonl`，并定义其训练集和验证集的划分。
        id: register-dataset
        name: Register Training Dataset
        tags:
          - data-asset
          - registration
      - description: >-
          创建一套完整的模型训练超参数配置。业务目的：为微调作业提供可复现且经过验证的训练策略模板。输入：配置标识符、调优目标（如SFT）、详细的参数集合（优化器配置、学习率、LoRA参数、训练轮次等）。输出：创建成功的配置ID及完整的配置详情。主要被算法研究员调用，用于定义和保存不同的训练方案。
        examples:
          - >-
            创建一套名为`lora-sft-001`的超参数配置，目标为监督微调（SFT），使用AdamW优化器（学习率2e-5），并启用LoRA（秩r=8，alpha=16），训练3个epoch。
        id: create-hyperparameter
        name: Create Hyperparameter Configuration
        tags:
          - training-config
          - tuning
      - description: >-
          定义一个具体的模型微调任务实例。业务目的：将模型、数据、配置等静态资产组合成一个可执行的训练作业。输入：作业名称、微调规格（引用的模型ID、数据集ID、超参数配置ID）、计算资源限制、可选的评估插件和服务部署配置。输出：创建成功的作业ID及作业配置摘要。主要被实验编排Agent或直接用户调用，是启动训练的核心步骤。
        examples:
          - >-
            创建一个名为`exp1-job-a`的微调作业，使用基础模型`llama-3-8b-base`、数据集`finance-qa-zh`和超参数配置`lora-sft-001`，申请2块A100
            GPU，并配置在完成后使用`accuracy-scorer`插件进行评估。
        id: create-finetune-job
        name: Create Finetune Job
        tags:
          - job-management
          - orchestration
      - description: >-
          定义一个顶层微调实验，用于管理多个相关作业及其共享配置。业务目的：组织批量实验，支持变量控制和结果对比，实现复杂的实验流程（如网格搜索）。输入：实验名称、作业设置列表（每个设置可覆盖共享配置）、共享的评估插件配置、共享的服务配置。输出：创建成功的实验ID及实验结构概览。主要被实验负责人或自动化脚本调用，用于发起多组对比实验。
        examples:
          - >-
            创建一个名为`hyperparam-search-01`的实验，包含3个子作业，分别使用超参数配置`lora-sft-001`、`lora-sft-002`和`lora-sft-003`，但共享同一个基础模型、数据集和评估插件，以比较不同学习率的效果。
        id: create-finetune-experiment
        name: Create Finetune Experiment
        tags:
