[project]
name = "skill-hub"
version = "0.1.0"
description = "skill hub"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "click>=8.1.8",
    "pydantic>=2.11.4",
    "packaging>=24.0",
    "python-dotenv",
    "setuptools",
    "wheel",
    "langfuse~=3.9.0",
    "model_sdk @ file:///Users/james/daocloud/code/dac/skill-hub/sdks/model_sdk-0.2.0-py3-none-any.whl",
    "skill_sdk @ file:///Users/james/daocloud/code/dac/skill-hub/sdks/skill_sdk-0.2.0-py3-none-any.whl",
]

[project.scripts]
skill-hub = "skill_hub.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_hub"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pyright]
include = ["skill_hub"]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.uv]
dev-dependencies = []
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple/"