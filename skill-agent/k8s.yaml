apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: biz-skill-agent
  name: biz-skill-agent
  namespace: dac
spec:
  replicas: 1
  selector:
    matchLabels:
      app: biz-skill-agent
  template:
    metadata:
      labels:
        app: biz-skill-agent
    spec:
      containers:
      - name: biz-skill-agent
        env:
        - name: Agent_Host
          value: "biz-skill-agent.dac.svc.cluster.local"
        - name: Agent_Port
          value: "10100"
        - name: Agent_Name
          value: "SkillAgent"
        - name: REGISTER_AGENT
          value: "true"
        - name: LANGFUSE_BASE_URL
          value: "http://10.17.0.43:3000"
        - name: LANGFUSE_SECRET_KEY
          value: "sk-lf-a8cd7ec4-d08c-4f2b-a174-d458073d6d73"
        - name: LANGFUSE_PUBLIC_KEY
          value: "pk-lf-ebed2fcd-31df-4c35-ba33-d6bf0ab399e5"
        - name: SKILLS
          value: '["weather","web_fetch","tavily-search","code_execution"]'
        - name: SKILL_DOWNLOAD_OVERWRITE
          value: "true"
        - name: SKILL_DOWNLOAD_CONCURRENCY
          value: "8"
        - name: TAVILY_BASE_URL
          value: "https://api.tavily.com"
        - name: TAVILY_API_KEY
          value: "xxx"
        image: registry.cn-shanghai.aliyuncs.com/jamesxiong/skill-agent:12-amd64
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 10100
        args:
          - "--redis-host"
          - "redis-server.dac.svc.cluster.local"
          - "--redis-port"
          - "6379"
          - "--redis-db"
          - "2"
          - "--password"
          - "123"
          - "--provider"
          - "openai_compatible"
          - "--api-key"
          - "sk-xxx"
          - "--base-url"
          - "https://dashscope.aliyuncs.com/compatible-mode/v1"
          - "--model"
          - "deepseek-v3.2"
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 1Gi
      restartPolicy: Always

---

kind: Service
apiVersion: v1
metadata:
  name: biz-skill-agent
  namespace: dac
spec:
  ports:
    - name: tcp-10100-10100
      protocol: TCP
      port: 10100
      targetPort: 10100
  selector:
    app: biz-skill-agent
  type: NodePort