name: Python syntax

on:
  pull_request:
  push:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile tracked Python sources
        shell: bash
        run: |
          git ls-files -z '*.py' | xargs -0 python -m py_compile
