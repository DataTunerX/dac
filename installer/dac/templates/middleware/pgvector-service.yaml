{{- if .Values.pgvector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dac.pgvector.serviceName" . }}
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "pgvector") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.pgvector.port }}
      targetPort: 5432
  selector:
    {{- include "dac.selectorLabels" (dict "context" . "name" "pgvector") | nindent 4 }}
{{- end }}
