{{- if .Values.pgvector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dac.pgvector.serviceName" . }}-initdb
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "pgvector") | nindent 4 }}
data:
  init-pgvector.sh: |
    #!/bin/bash
    set -e

    {{- range .Values.pgvector.databases }}

    # Create database {{ . }} if not exists, then enable pgvector
    psql -v ON_ERROR_STOP=0 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
      -tc "SELECT 1 FROM pg_database WHERE datname = '{{ . }}'" \
      | grep -q 1 || \
      psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
        -c "CREATE DATABASE {{ . }}"

    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "{{ . }}" \
      -c "CREATE EXTENSION IF NOT EXISTS vector"
    {{- end }}

    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
      -c "CREATE EXTENSION IF NOT EXISTS vector"
{{- end }}
