{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dac.mysql.serviceName" . }}-initdb
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "mysql") | nindent 4 }}
data:
  init.sql: |
    {{- range .Values.mysql.databases }}
    CREATE DATABASE IF NOT EXISTS `{{ . }}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    {{- end }}
{{- end }}
