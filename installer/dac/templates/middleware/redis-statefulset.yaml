{{- if and .Values.redis.enabled (not .Values.redis.external.host) }}
{{- $registry := .Values.global.imageRegistry }}
{{- if hasKey .Values.redis.image "registry" }}
{{- $registry = .Values.redis.image.registry }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dac.redis.serviceName" . }}
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "redis") | nindent 4 }}
spec:
  serviceName: {{ include "dac.redis.serviceName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "dac.selectorLabels" (dict "context" . "name" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dac.selectorLabels" (dict "context" . "name" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ include "dac.image" (dict "registry" $registry "repository" .Values.redis.image.repository "tag" .Values.redis.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: redis
              containerPort: 6379
          command: ["redis-server"]
          args:
            - "--requirepass"
            - {{ .Values.redis.password | quote }}
            - "--appendonly"
            - "yes"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "-a", {{ .Values.redis.password | quote }}, "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", {{ .Values.redis.password | quote }}, "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      {{- if not .Values.redis.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.redis.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- $sc := .Values.redis.persistence.storageClass | default .Values.global.storageClass }}
        {{- if $sc }}
        storageClassName: {{ $sc | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
  {{- end }}
{{- end }}
