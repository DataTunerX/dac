{{- if and .Values.skillHub.enabled .Values.skillHub.auth.pushToken (not .Values.skillHub.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dac.skillHub.serviceName" . }}-auth
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "skill-hub") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.skillHub.auth.existingSecretKey }}: {{ .Values.skillHub.auth.pushToken | quote }}
{{- end }}
