{{- if .Values.executionEngine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dac.componentName" (dict "context" . "name" "execution-engine") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "execution-engine") | nindent 4 }}
spec:
  replicas: {{ .Values.executionEngine.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "dac.selectorLabels" (dict "context" . "name" "execution-engine") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dac.selectorLabels" (dict "context" . "name" "execution-engine") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "dac.componentName" (dict "context" . "name" "execution-engine") }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: {{ include "dac.image" (dict "registry" (.Values.executionEngine.image.registry | default .Values.global.imageRegistry) "repository" .Values.executionEngine.image.repository "tag" .Values.executionEngine.image.tag) }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.executionEngine.resources | nindent 10 }}
{{- end }}
