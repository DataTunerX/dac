{{- if and .Values.bizOrchestratorRegistry.enabled (not .Values.schemaRegistry.auth.existingSecret) }}
{{- $name := include "dac.schemaRegistryAuthSecretName" . -}}
{{- $key := .Values.schemaRegistry.auth.tokenKey -}}
{{- $token := randAlphaNum 64 -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing $existing.data (hasKey $existing.data $key) -}}
{{- $token = (index $existing.data $key | b64dec) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "schema-registry-auth") | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $token | b64enc | quote }}
{{- end }}
