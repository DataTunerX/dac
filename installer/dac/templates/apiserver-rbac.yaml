{{- if .Values.apiserver.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dac.componentName" (dict "context" . "name" "dac-apiserver") }}
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "dac-apiserver") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dac.componentName" (dict "context" . "name" "dac-apiserver") }}
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "dac-apiserver") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["dac.dac.io"]
    resources: ["dataagentcontainers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["dac.dac.io"]
    resources: ["dataagentcontainers/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["dac.dac.io"]
    resources: ["datadescriptors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["dac.dac.io"]
    resources: ["datadescriptors/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dac.componentName" (dict "context" . "name" "dac-apiserver") }}
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "dac-apiserver") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dac.componentName" (dict "context" . "name" "dac-apiserver") }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "dac.componentName" (dict "context" . "name" "dac-apiserver") }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
