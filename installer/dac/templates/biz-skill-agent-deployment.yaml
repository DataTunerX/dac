{{- if .Values.bizSkillAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dac.bizSkillAgent.serviceName" . }}
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "biz-skill-agent") | nindent 4 }}
spec:
  replicas: {{ .Values.bizSkillAgent.replicas }}
  selector:
    matchLabels:
      {{- include "dac.selectorLabels" (dict "context" . "name" "biz-skill-agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dac.selectorLabels" (dict "context" . "name" "biz-skill-agent") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: biz-skill-agent
          image: {{ include "dac.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.bizSkillAgent.image.repository "tag" .Values.bizSkillAgent.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.bizSkillAgent.service.targetPort }}
          env:
            - name: Agent_Host
              value: "{{ include "dac.bizSkillAgent.serviceName" . }}.{{ .Release.Namespace }}.svc.cluster.local"
            - name: Agent_Port
              value: {{ .Values.bizSkillAgent.service.targetPort | quote }}
            - name: Agent_Name
              value: {{ .Values.bizSkillAgent.config.agentName | quote }}
            - name: REGISTER_AGENT
              value: {{ .Values.bizSkillAgent.config.registerAgent | quote }}
            - name: LOCAL_SKILL_MAX_STEPS
              value: {{ .Values.bizSkillAgent.config.maxSteps | quote }}
            - name: LOCAL_SKILL_CMD_TIMEOUT_SEC
              value: {{ .Values.bizSkillAgent.config.cmdTimeoutSec | quote }}
            - name: LOCAL_SKILL_MAX_CONCURRENCY
              value: {{ .Values.bizSkillAgent.config.maxConcurrency | quote }}
            # Startup-time skill download from skill-hub. Agent will fetch each
            # {name}.zip into SKILLS_DOWNLOAD_DIR before SkillRunner preload.
            - name: SKILLS
              value: {{ toJson .Values.bizSkillAgent.config.skills | quote }}
            - name: SKILL_HUB_URL
              value: {{ coalesce .Values.bizSkillAgent.config.skillHubUrl (include "dac.skillHub.url" .) | quote }}
            - name: SKILLS_DOWNLOAD_DIR
              value: {{ .Values.bizSkillAgent.config.skillsDownloadDir | quote }}
            - name: LOCAL_SKILLS_DIR
              value: {{ .Values.bizSkillAgent.config.skillsDownloadDir | quote }}
            - name: SKILL_DOWNLOAD_OVERWRITE
              value: {{ .Values.bizSkillAgent.config.skillDownloadOverwrite | quote }}
            - name: SKILL_DOWNLOAD_CONCURRENCY
              value: {{ .Values.bizSkillAgent.config.skillDownloadConcurrency | quote }}
            {{- with .Values.bizSkillAgent.config.skillDownloadTimeout }}
            - name: SKILL_DOWNLOAD_TIMEOUT
              value: {{ . | quote }}
            {{- end }}
            - name: SKILL_SYNC_ENABLED
              value: {{ .Values.bizSkillAgent.config.skillSyncEnabled | quote }}
            - name: SKILL_SYNC_INTERVAL
              value: {{ .Values.bizSkillAgent.config.skillSyncInterval | quote }}
            - name: SKILL_SYNC_WATCH_ALL
              value: {{ .Values.bizSkillAgent.config.skillSyncWatchAll | quote }}
            {{- include "dac.langfuseEnv" . | nindent 12 }}
          args:
            - "--redis-host"
            - {{ include "dac.redis.serviceName" . | quote }}
            - "--redis-port"
            - {{ .Values.redis.port | quote }}
            - "--redis-db"
            - {{ .Values.bizSkillAgent.config.redisDb | quote }}
            - "--password"
            - {{ .Values.redis.password | quote }}
            {{- include "dac.llmArgs" . | nindent 12 }}
          resources:
            {{- toYaml .Values.bizSkillAgent.resources | nindent 12 }}
{{- end }}
