{{- if .Values.apiserver.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dac.componentName" (dict "context" . "name" "dac-apiserver-config") }}
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "dac-apiserver") | nindent 4 }}
data:
  config.yaml: |
    agent_registry:
      orchestrator_base_url: "http://orchestrator-registry.dac.svc.cluster.local:8000"
      biz_orchestrator_base_url: "http://biz-orchestrator-registry.dac.svc.cluster.local:8000"
      timeout: 10s

    server:
      host: "0.0.0.0"
      port: {{ .Values.apiserver.service.targetPort }}
      mode: {{ .Values.apiserver.config.server.mode | quote }}
      read_timeout: {{ .Values.apiserver.config.server.readTimeout }}
      write_timeout: {{ .Values.apiserver.config.server.writeTimeout }}
      max_request_body_size: {{ .Values.apiserver.config.server.maxRequestBodySize | int64 }}

    log:
      level: {{ .Values.apiserver.config.log.level | quote }}
      format: {{ .Values.apiserver.config.log.format | quote }}
      output: "stdout"
      add_source: false

    observability:
      enable_metrics: {{ .Values.apiserver.config.observability.enableMetrics }}
      metrics_port: {{ .Values.apiserver.service.metricsPort }}
      enable_tracing: {{ .Values.apiserver.config.observability.enableTracing }}
      tracing_endpoint: ""

    jwt:
      secret: {{ .Values.apiserver.config.jwt.secret | quote }}
      timeout: {{ .Values.apiserver.config.jwt.timeout | quote }}
      max_refresh: {{ .Values.apiserver.config.jwt.maxRefresh | quote }}
      cookie_secure: {{ .Values.apiserver.config.jwt.cookieSecure }}
      cookie_domain: {{ .Values.apiserver.config.jwt.cookieDomain | quote }}

    routing_agent:
      base_url: "http://{{ include "dac.bizRoutingAgent.serviceName" . }}:{{ .Values.bizRoutingAgent.service.port }}"
      timeout: {{ .Values.apiserver.config.routingAgent.timeout }}
      session_timeout: {{ .Values.apiserver.config.routingAgent.sessionTimeout }}

    data_services:
      base_url: {{ include "dac.dataServices.url" . | quote }}

    # skill-hub base URL is hardcoded in apiserver to
    # http://skill-hub.dac.svc.cluster.local:8000; only timeout is configurable here.
    skill_hub:
      timeout: 120s

    # TDB pipeline controller (runs outside DAC, on the fw-worker cluster).
    # `targets` is DAC's copy of the controller's domain-config allowlist: the
    # controller exposes no endpoint for it. Each gateway is the same TDB the
    # matching domain skill agent queries, so ingestion and Q&A share one TDB.
    # Keys under targets/defaults are snake_case because they are passed to the
    # apiserver config verbatim.
    tdb_pipeline:
      base_url: {{ .Values.apiserver.config.tdbPipeline.baseUrl | quote }}
      caller_id: {{ .Values.apiserver.config.tdbPipeline.callerId | quote }}
      timeout: {{ .Values.apiserver.config.tdbPipeline.timeout | quote }}
      llm_profiles:
        {{- toYaml .Values.apiserver.config.tdbPipeline.llmProfiles | nindent 8 }}
      images:
        {{- toYaml .Values.apiserver.config.tdbPipeline.images | nindent 8 }}
      skill:
        {{- toYaml .Values.apiserver.config.tdbPipeline.skill | nindent 8 }}
      defaults:
        {{- toYaml .Values.apiserver.config.tdbPipeline.defaults | nindent 8 }}
      targets:
        {{- toYaml .Values.apiserver.config.tdbPipeline.targets | nindent 8 }}

    database:
      driver: "mysql"
      host: {{ include "dac.mysql.host" . | quote }}
      port: {{ include "dac.mysql.port" . }}
      user: {{ .Values.apiserver.config.database.user | quote }}
      password: {{ include "dac.mysql.password" . | quote }}
      database: {{ .Values.apiserver.config.database.database | quote }}
      max_open_conns: {{ .Values.apiserver.config.database.maxOpenConns }}
      max_idle_conns: {{ .Values.apiserver.config.database.maxIdleConns }}
      conn_max_lifetime: {{ .Values.apiserver.config.database.connMaxLifetime }}

  model.conf: |
    [request_definition]
    r = sub, obj, act

    [policy_definition]
    p = sub, obj, act

    [role_definition]
    g = _, _

    [policy_effect]
    e = some(where (p.eft == allow))

    [matchers]
    m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && (p.act == "*" || r.act == p.act)

  policy.csv: |
    p, admin, *, *
    p, user, /api/v1/users/me, GET
    p, user, /api/v1/chat/conversations, GET
    p, user, /api/v1/chat/conversations/*, GET
    p, user, /api/v1/agents, GET
    p, user, /api/v1/descriptors, GET
    p, user, /api/v1/namespaces, GET
    p, user, /api/v1/namespaces/*/agents, GET
    p, user, /api/v1/namespaces/*/agents/*, GET
    p, user, /api/v1/namespaces/*/descriptors, GET
    p, user, /api/v1/namespaces/*/descriptors/*, GET
    p, user, /api/v1/namespaces/*/configmaps, GET
    p, user, /api/v1/namespaces/*/configmaps/*, GET
    p, user, /api/v1/semantic-groups, GET
    p, user, /api/v1/semantic-groups/*, GET
    p, user, /api/v1/discovery/scans, GET
    p, user, /api/v1/discovery/scans/*, GET
    p, user, /api/v1/knowledge-graph/*, POST
    p, user, /api/v1/skills/namespaces, GET
    p, user, /api/v1/skills/namespaces/*/exists, GET
    p, user, /api/v1/skills/namespaces/*/skills, GET
    p, user, /api/v1/skills/namespaces/*/skills/*/download, GET
    p, user, /api/v1/tdb-pipeline/options, GET
    p, user, /api/v1/tdb-pipeline/runs, GET
    p, user, /api/v1/tdb-pipeline/runs/*, GET
    p, user, /v1/chat/completions, POST

    g, admin, admin
    g, user, user
{{- end }}
