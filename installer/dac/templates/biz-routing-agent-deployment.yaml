{{- if .Values.bizRoutingAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dac.bizRoutingAgent.serviceName" . }}
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "biz-routing-agent") | nindent 4 }}
spec:
  replicas: {{ .Values.bizRoutingAgent.replicas }}
  selector:
    matchLabels:
      {{- include "dac.selectorLabels" (dict "context" . "name" "biz-routing-agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dac.selectorLabels" (dict "context" . "name" "biz-routing-agent") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: biz-routing-agent
          image: {{ include "dac.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.bizRoutingAgent.image.repository "tag" .Values.bizRoutingAgent.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.bizRoutingAgent.service.targetPort }}
          env:
            - name: Agent_Host
              value: "{{ include "dac.bizRoutingAgent.serviceName" . }}"
            - name: Agent_Port
              value: {{ .Values.bizRoutingAgent.service.targetPort | quote }}
            - name: AgentRegistry
              value: "http://{{ include "dac.bizOrchestratorRegistry.serviceName" . }}:{{ .Values.bizOrchestratorRegistry.service.port }}"
            - name: AgentRegistryCollection
              value: {{ .Values.bizRoutingAgent.config.registryCollection | quote }}
            - name: max_retries
              value: {{ .Values.bizRoutingAgent.config.maxRetries | quote }}
            # simple: pick the single best agent and forward the query as-is.
            # broadcast: also allow multi-root task planning across several agents.
            - name: ROUTING_MODE
              value: {{ .Values.bizRoutingAgent.config.routingMode | quote }}
            {{- include "dac.langfuseEnv" . | nindent 12 }}
            {{- include "dac.enableThinkingEnv" . | nindent 12 }}
          args:
            {{- include "dac.redisArgs" (dict "context" . "redisDB" .Values.bizRoutingAgent.config.redisDb) | nindent 12 }}
            {{- include "dac.llmArgs" . | nindent 12 }}
          resources:
            {{- toYaml .Values.bizRoutingAgent.resources | nindent 12 }}
{{- end }}
