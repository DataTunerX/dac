{{- if .Values.executionEngine.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dd-configuration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "execution-engine") | nindent 4 }}
data:
  {{- include "dac.observationConfigMapData" . | nindent 2 }}
  redis-host: {{ printf "%s.%s.svc.cluster.local" (include "dac.redis.serviceName" .) .Release.Namespace | quote }}
  redis-port: {{ .Values.redis.port | default "6379" | quote }}
  redis-password: {{ .Values.redis.password | default "123" | quote }}
  data-services-url: {{ printf "http://%s.%s.svc.cluster.local:%v" (include "dac.dataServices.serviceName" .) .Release.Namespace (.Values.dataServices.service.port | default 8000) | quote }}
  data-sinker-job-image: {{ include "dac.image" (dict "registry" .Values.global.imageRegistry "repository" (.Values.executionEngine.agentImages.dataSinkerJob.repository | default "data-sinkers-job") "tag" .Values.executionEngine.agentImages.dataSinkerJob.tag) | quote }}
  data-sinker-status-image: {{ include "dac.image" (dict "registry" .Values.global.imageRegistry "repository" (.Values.executionEngine.agentImages.dataSinkerStatus.repository | default "data-sinkers-status") "tag" .Values.executionEngine.agentImages.dataSinkerStatus.tag) | quote }}
  dac-data-services-image: {{ include "dac.image" (dict "registry" .Values.global.imageRegistry "repository" (.Values.executionEngine.agentImages.dacDataServices.repository | default "dac-data-services") "tag" .Values.executionEngine.agentImages.dacDataServices.tag) | quote }}
  llm-config: {{ .Values.executionEngine.ddConfig.llmConfig | default "llm-default" | quote }}
{{- end }}
