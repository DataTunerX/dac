{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dac.componentName" (dict "context" . "name" "frontend") }}
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "dac.selectorLabels" (dict "context" . "name" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dac.selectorLabels" (dict "context" . "name" "frontend") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "dac.image" (dict "registry" (.Values.frontend.image.registry | default .Values.global.imageRegistry) "repository" .Values.frontend.image.repository "tag" .Values.frontend.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.targetPort }}
          env:
            - name: BACKEND_URL
              value: "http://{{ include "dac.componentName" (dict "context" . "name" "dac-apiserver") }}:{{ .Values.apiserver.service.port }}"
            # Must match apiserver.config.jwt.secret so middleware /api/auth/session can jose-verify.
            - name: DAC_JWT_SECRET
              value: {{ .Values.apiserver.config.jwt.secret | quote }}
            - name: DAC_JWT_MAX_REFRESH
              value: {{ .Values.apiserver.config.jwt.maxRefresh | quote }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
{{- end }}
