{{- if .Values.executionEngine.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dac-configuration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dac.componentLabels" (dict "context" . "name" "execution-engine") | nindent 4 }}
data:
  {{- include "dac.observationConfigMapData" . | nindent 2 }}
  redis-host: {{ include "dac.redis.host" . | quote }}
  redis-port: {{ include "dac.redis.port" . | quote }}
  redis-password: {{ include "dac.redis.password" . | quote }}
  data-services-url: {{ printf "http://%s.%s.svc.cluster.local:%v" (include "dac.dataServices.serviceName" .) .Release.Namespace (.Values.dataServices.service.port | default 8000) | quote }}
  biz-orchestrator-agent-registry: {{ printf "http://%s.%s.svc.cluster.local:%v" (include "dac.bizOrchestratorRegistry.serviceName" .) .Release.Namespace (.Values.bizOrchestratorRegistry.service.port | default 8000) | quote }}
  orchestrator-agent-registry: {{ printf "http://%s.%s.svc.cluster.local:%v" (include "dac.orchestratorRegistry.serviceName" .) .Release.Namespace (.Values.orchestratorRegistry.service.port | default 8000) | quote }}
  orchestrator-agent-image: {{ include "dac.image" (dict "registry" .Values.global.imageRegistry "repository" (.Values.executionEngine.agentImages.orchestratorAgent.repository | default "orchestrator-agent") "tag" .Values.executionEngine.agentImages.orchestratorAgent.tag) | quote }}
  expert-agent-image: {{ include "dac.image" (dict "registry" .Values.global.imageRegistry "repository" (.Values.executionEngine.agentImages.expertAgent.repository | default "expert-agent") "tag" .Values.executionEngine.agentImages.expertAgent.tag) | quote }}
  ds-data-services-image: {{ include "dac.image" (dict "registry" .Values.global.imageRegistry "repository" (.Values.executionEngine.agentImages.dacDataServices.repository | default "dac-data-services") "tag" .Values.executionEngine.agentImages.dacDataServices.tag) | quote }}
  code-agent-image: {{ include "dac.image" (dict "registry" .Values.global.imageRegistry "repository" (.Values.executionEngine.agentImages.codeAgent.repository | default "code-agent") "tag" .Values.executionEngine.agentImages.codeAgent.tag) | quote }}
  doc-agent-image: {{ include "dac.image" (dict "registry" .Values.global.imageRegistry "repository" (.Values.executionEngine.agentImages.docAgent.repository | default "doc-agent") "tag" .Values.executionEngine.agentImages.docAgent.tag) | quote }}
  dd-sync-observer-image: {{ include "dac.image" (dict "registry" .Values.global.imageRegistry "repository" (.Values.executionEngine.agentImages.dataSinkersObserver.repository | default "data-sinkers-observer") "tag" .Values.executionEngine.agentImages.dataSinkersObserver.tag) | quote }}
  skill-agent-image: {{ include "dac.image" (dict "registry" .Values.global.imageRegistry "repository" (.Values.executionEngine.agentImages.skillAgent.repository | default "skill-agent") "tag" .Values.executionEngine.agentImages.skillAgent.tag) | quote }}
  default-planner-llm: {{ .Values.executionEngine.dacConfig.defaultPlannerLLM | default "llm-default" | quote }}
  default-expert-llm: {{ .Values.executionEngine.dacConfig.defaultExpertLLM | default "llm-default" | quote }}
  sg-member-capability-check-enabled: {{ .Values.executionEngine.dacConfig.memberCapabilityCheckEnabled | quote }}
  sg-member-capability-check-shadow: {{ .Values.executionEngine.dacConfig.memberCapabilityCheckShadow | default false | quote }}
  sg-member-capability-max-concurrency: {{ .Values.executionEngine.dacConfig.memberCapabilityMaxConcurrency | default 8 | quote }}
  sg-member-capability-member-timeout-sec: {{ .Values.executionEngine.dacConfig.memberCapabilityMemberTimeoutSec | default 60 | quote }}
  sg-member-capability-total-timeout-sec: {{ .Values.executionEngine.dacConfig.memberCapabilityTotalTimeoutSec | default 180 | quote }}
  cross-sg-max-hop: {{ .Values.executionEngine.dacConfig.crossSGMaxHop | default "5" | quote }}
  cross-sg-mid-exec-rounds: {{ .Values.executionEngine.dacConfig.crossSGMidExecRounds | default "5" | quote }}
{{- end }}
