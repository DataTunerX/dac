{{- if .Values.apiserver.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "dac.componentName" (dict "context" . "name" "dac-test-connection") | quote }}
  labels:
    {{- include "dac.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['--timeout=5', '{{ include "dac.componentName" (dict "context" . "name" "dac-apiserver") }}:{{ .Values.apiserver.service.port }}/health/ready']
  restartPolicy: Never
{{- end }}
