# =============================================================================
# DAC Helm Chart - Default Values
# All values are documented inline. Override via --set or -f values-prod.yaml
# =============================================================================

# -- Override the chart name used in resource names
nameOverride: ""
# -- Override the full release name (takes precedence over nameOverride)
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Global settings shared across all components
# ---------------------------------------------------------------------------
global:
  # -- Target namespace (informational; actual namespace is set at install time)
  namespace: dac
  # -- Container image registry prefix for all DAC images
  imageRegistry: "registry.cn-shanghai.aliyuncs.com/jamesxiong"
  # -- Default image pull policy (IfNotPresent | Always | Never)
  imagePullPolicy: IfNotPresent
  # -- Image pull secrets for private registries
  imagePullSecrets: []
  #  - name: my-registry-secret
  # -- Default StorageClass for all middleware PVCs ("" = cluster default)
  storageClass: "nfs-csi"

  # -- LLM provider configuration (shared by all agents)
  llm:
    # -- LLM provider type
    provider: "openai_compatible"
    # -- LLM API key (replace placeholder before use, e.g. sk-xxx → your real key)
    apiKey: "sk-xxx"
    # -- LLM API base URL
    baseUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    # -- Default LLM model for agents
    model: "qwen2.5-72b-instruct"
    # -- Default LLM temperature
    temperature: "0.01"

  # -- Langfuse LLM observability (biz-routing-agent, biz-chart-agent); set enabled: true and fill keys to turn on
  langfuse:
    enabled: false
    baseUrl: ""
    secretKey: ""
    publicKey: ""

  # -- Embedding model configuration (used by data-services)
  embedding:
    # -- Embedding provider name (dashscope | openai_compatible | azure)
    provider: "dashscope"
    # -- Embedding API key (replace placeholder before use)
    apiKey: "sk-xxx"
    # -- Embedding API base URL (required for openai_compatible; dashscope ignores this)
    baseUrl: ""
    # -- Embedding model name
    model: "text-embedding-v4"
    # -- Embedding vector dimensions
    dims: "1024"

# =============================================================================
# Middleware - Built-in single-node StatefulSet instances
# Set <svc>.external.host to use an external instance (built-in deploy is skipped).
# Or set enabled: false when you manage connectivity another way.
# =============================================================================

# ---------------------------------------------------------------------------
# MySQL 8.0 (used by: apiserver DB, data-services fingerprint/history)
# ---------------------------------------------------------------------------
mysql:
  # -- Deploy built-in MySQL. Ignored when mysql.external.host is set.
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
  # -- MySQL service port
  port: 3306
  # -- Root password (CHANGE THIS before production use)
  rootPassword: "dac123"
  # -- Databases to create on init
  databases:
    - dac_db
    - fingerprint
    - history
  persistence:
    # -- Enable persistent storage via volumeClaimTemplates
    enabled: true
    # -- Override global.storageClass for MySQL ("" = use global)
    storageClass: ""
    # -- PVC size
    size: 2Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi


  # -- External MySQL connection. When host is set, the built-in StatefulSet/
  #    Service are not rendered and all consumers use these connection values.
  external:
    host: ""
    port: 3306
    password: ""
# ---------------------------------------------------------------------------
# Redis 7 (used by: agents, data-sinkers-job, semantic-grouper, registries)
# ---------------------------------------------------------------------------
redis:
  # -- Deploy built-in Redis. Ignored when redis.external.host is set.
  enabled: true
  image:
    repository: redis
    tag: "7.0.4"
  # -- Redis service port
  port: 6379
  # -- Redis auth password (CHANGE THIS before production use)
  password: "123"
  persistence:
    # -- Enable persistent storage via volumeClaimTemplates
    enabled: true
    # -- Override global.storageClass for Redis ("" = use global)
    storageClass: ""
    # -- PVC size
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # -- External Redis connection. When host is set, the built-in StatefulSet/
  #    Service are not rendered and all consumers use these connection values.
  external:
    host: ""
    port: 6379
    password: ""

# ---------------------------------------------------------------------------
# PostgreSQL 16 + pgvector (used by: data-services vectors and memory)
# ---------------------------------------------------------------------------
pgvector:
  # -- Deploy built-in pgvector. Ignored when pgvector.external.host is set.
  enabled: true
  image:
    repository: pgvector
    tag: "pg16-amd64"
  # -- PostgreSQL service port
  port: 5432
  # -- PostgreSQL superuser name
  user: "postgres"
  # -- PostgreSQL superuser password (CHANGE THIS before production use)
  password: "postgres"
  # -- Databases to create on init (vector extension enabled in each)
  databases:
    - knowledge_vector
    - agent_memory
  persistence:
    # -- Enable persistent storage via volumeClaimTemplates
    enabled: true
    # -- Override global.storageClass for PGVector ("" = use global)
    storageClass: ""
    # -- PVC size
    size: 2Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  # -- External PostgreSQL/pgvector connection. When host is set, the built-in
  #    StatefulSet/Service are not rendered and all consumers use these values.
  external:
    host: ""
    port: 5432
    password: ""

# ---------------------------------------------------------------------------
# Neo4j (used by: data-services)
# Mirrors docker compose: 5.18.0, 7474/7687, APOC, data/logs/import volumes.
# For docker.m.daocloud.io/neo4j: set global.imageRegistry: "docker.m.daocloud.io"
# ---------------------------------------------------------------------------
neo4j:
  # -- Deploy built-in Neo4j. Ignored when neo4j.external.host is set.
  enabled: true
  image:
    repository: neo4j
    tag: "5.18.0"
  # -- Neo4j browser / HTTP Service port (container listens on 7474)
  httpPort: 7474
  # -- Neo4j Bolt Service port (container listens on 7687)
  boltPort: 7687
  # -- Neo4j auth username
  username: neo4j
  # -- Neo4j auth password (CHANGE THIS before production use)
  password: "test123456"
  # -- Set NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
  acceptLicense: true
  # -- Server plugins (becomes env NEO4J_PLUGINS JSON array)
  plugins:
    - apoc
  apoc:
    exportFileEnabled: true
    importFileEnabled: true
  persistence:
    # -- Enable persistent storage via volumeClaimTemplates
    enabled: true
    # -- Override global.storageClass for Neo4j ("" = use global)
    storageClass: ""
    # -- PVC size for /data
    data:
      size: 10Gi
    # -- PVC size for /logs
    logs:
      size: 2Gi
    # -- PVC size for /var/lib/neo4j/import
    import:
      size: 5Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  # -- External Neo4j connection. When host is set, the built-in StatefulSet/
  #    Service are not rendered; bolt/neo4j URLs are built as bolt://host:boltPort
  #    and neo4j://host:boltPort (overrides dataServices.config.neo4j.* URLs).
  external:
    host: ""
    # -- Bolt port for external Neo4j (default: neo4j.boltPort / 7687)
    boltPort: 7687
    password: ""

# =============================================================================
# Core Platform Services
# =============================================================================

# ---------------------------------------------------------------------------
# dac-apiserver - Go HTTP API server with JWT auth and Casbin RBAC
# ---------------------------------------------------------------------------
apiserver:
  # -- Enable apiserver deployment
  enabled: true
  image:
    repository: dac-apiserver
    tag: "v0.12.0-amd64"
  # -- Number of replicas
  replicas: 1
  service:
    # -- Service type (ClusterIP | NodePort | LoadBalancer)
    type: ClusterIP
    # -- Service port exposed to other services
    port: 80
    # -- Container port the Go binary listens on
    targetPort: 8080
    # -- Prometheus metrics port
    metricsPort: 9090
  config:
    server:
      # -- Gin run mode (release | debug)
      mode: "release"
      readTimeout: "60s"
      writeTimeout: "60s"
      # -- Max request body size in bytes (10 MB)
      maxRequestBodySize: 10485760
    log:
      # -- Log level (debug | info | warn | error)
      level: "info"
      # -- Log format (json | text)
      format: "json"
    observability:
      enableMetrics: false
      enableTracing: false
    routingAgent:
      # -- Timeout for routing agent calls
      timeout: "300s"
      # -- Session timeout for chat sessions
      sessionTimeout: "30m"
    database:
      # -- MySQL user for apiserver database
      user: "root"
      # -- Database name
      database: "dac_db"
      maxOpenConns: 25
      maxIdleConns: 5
      connMaxLifetime: "5m"
    jwt:
      # -- JWT signing secret (CHANGE THIS before production use)
      secret: "dac-jwt-secret-change-me"
      # -- Access token lifetime
      timeout: "15m"
      # -- Maximum refresh window; also used by the frontend middleware
      maxRefresh: "168h"
      # -- Send the authentication cookie only over HTTPS
      cookieSecure: false
      # -- Optional authentication cookie domain
      cookieDomain: ""
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ---------------------------------------------------------------------------
# frontend - Next.js UI with nginx reverse proxy
# ---------------------------------------------------------------------------
frontend:
  # -- Enable frontend deployment
  enabled: true
  image:
    # -- Optional override; empty uses global.imageRegistry
    #    (registry.cn-shanghai.aliyuncs.com/jamesxiong)
    registry: ""
    repository: frontend
    tag: "v0.12.0-amd64"
  # -- Number of replicas
  replicas: 1
  service:
    # -- Service type (NodePort for direct access, ClusterIP behind ingress)
    type: NodePort
    # -- Service port
    port: 3000
    # -- Container port
    targetPort: 3000
  # -- Ingress for external HTTPS access (disabled by default)
  ingress:
    enabled: false
    # -- Ingress class name (e.g. nginx, traefik)
    className: "nginx"
    # -- Additional ingress annotations
    annotations: {}
    hosts:
      - host: dac.example.com
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration
    tls: []
    #  - secretName: dac-tls
    #    hosts:
    #      - dac.example.com
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ---------------------------------------------------------------------------
# data-services - Core data/vector/memory/knowledge-graph API
# ---------------------------------------------------------------------------
dataServices:
  # -- Enable data-services deployment
  enabled: true
  image:
    repository: data-services
    tag: "v0.11.0-amd64"
  # -- Number of replicas
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  config:
    mysql:
      user: "root"
      # -- MySQL database for fingerprint storage
      fingerprintDatabase: "fingerprint"
      # -- MySQL database for history storage
      historyDatabase: "history"
      maxConnection: "50"
    pgvector:
      # -- pgvector database for knowledge vectors
      knowledgeDatabase: "knowledge_vector"
      minConnection: "1"
      maxConnection: "50"
    memory:
      # -- pgvector database for agent memory (mem0)
      database: "agent_memory"
      # -- Default memory collection name
      collection: "memories"
      minConnection: "1"
      maxConnection: "50"
      # -- Graph memory (enable | disable). Requires Neo4j.
      graphEnable: "disable"
    # -- Neo4j connection (only needed if graphEnable=enable).
    #    When neo4j.external.host is set, boltUrl/neo4jUrl below are ignored
    #    and URLs are derived from neo4j.external.host / boltPort.
    neo4j:
      # -- In-cluster Bolt URL (used when neo4j.external.host is empty)
      boltUrl: "bolt://neo4j:7687"
      # -- In-cluster neo4j:// URL for mem0 graph (used when neo4j.external.host is empty)
      neo4jUrl: "neo4j://neo4j:7687"
      username: "neo4j"
      password: "test123456"
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

# =============================================================================
# Execution Engine - CRD-based Operator (manages DataAgentContainer / DataDescriptor)
#
# The execution-engine operator watches DataAgentContainer (DAC) and
# DataDescriptor (DD) custom resources and DYNAMICALLY creates Deployments
# containing orchestrator-agent, expert-agent, code-agent, doc-agent,
# dac-data-services, data-sinkers-job, etc. Those components are NOT installed
# as static Deployments by Helm; they are created/destroyed by the operator
# at runtime in response to CR lifecycle events.
# =============================================================================
executionEngine:
  # -- Deploy the execution-engine operator
  enabled: true
  image:
    repository: execution-engine
    tag: "v0.11.0-amd64"
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # -- Images the operator injects into dynamically created Deployments.
  #    When a DataAgentContainer CR is created, the operator uses these images
  #    for the orchestrator-agent, expert-agent, code-agent, doc-agent,
  #    dac-data-services, data-sinkers-job and data-sinkers-status containers.
  agentImages:
    orchestratorAgent:
      # -- Repository name under global.imageRegistry
      repository: "orchestrator-agent"
      tag: "v0.11.0-amd64"
    expertAgent:
      # -- Repository name under global.imageRegistry
      repository: "expert-agent"
      tag: "v0.11.0-amd64"
    codeAgent:
      # -- Repository name under global.imageRegistry
      repository: "code-agent"
      tag: "v0.11.0-amd64"
    docAgent:
      # -- Repository name under global.imageRegistry
      repository: "doc-agent"
      tag: "v0.11.0-amd64"
    dacDataServices:
      # -- Repository name under global.imageRegistry
      repository: "dac-data-services"
      tag: "v0.11.0-amd64"
    dataSinkerJob:
      # -- Repository name under global.imageRegistry (image = registry/repository:tag)
      repository: "data-sinkers-job"
      tag: "v0.11.0-amd64"
    dataSinkerStatus:
      # -- Repository name under global.imageRegistry
      repository: "data-sinkers-status"
      tag: "v0.11.0-amd64"
    dataSinkersObserver:
      repository: "data-sinkers-observer"
      tag: "v0.11.0-amd64"
    # -- Image for dacType=skill single-container skill-agent Deployments
    skillAgent:
      repository: "skill-agent"
      tag: "v0.11.0-amd64"

  # -- dac-configuration ConfigMap values (read by DAC controller)
  dacConfig:
    # -- Default planner LLM ConfigMap name
    defaultPlannerLLM: "llm-default"
    # -- Default expert LLM ConfigMap name
    defaultExpertLLM: "llm-default"
    # -- Optional override for Langfuse URLs/keys (only used when global.langfuse.enabled; falls back to global.langfuse.*; also written as observation-* in dac-configuration / dd-configuration)
    observationBaseUrl: ""
    observationSecretKey: ""
    observationPublicKey: ""
    # -- Delegate Semantic Group capability checks to member data agents.
    memberCapabilityCheckEnabled: true
    # -- Compare member-delegated and legacy group-summary checks while returning legacy.
    memberCapabilityCheckShadow: false
    # -- Maximum concurrent member capability probes per Semantic Group.
    memberCapabilityMaxConcurrency: 8
    # -- Timeout in seconds for one member capability probe.
    memberCapabilityMemberTimeoutSec: 60
    # -- Total timeout in seconds for all member capability probes (also used as SG Expert sidecar check timeout).
    memberCapabilityTotalTimeoutSec: 180

  # -- dd-configuration ConfigMap values (read by DD controller)
  ddConfig:
    # -- LLM ConfigMap name used by data-sinkers-job
    llmConfig: "llm-default"

  # -- LLM model ConfigMaps created in the release namespace.
  #    The operator and CR spec reference these by name.
  #    Each field defaults to the corresponding global.llm.* value if left empty.
  llmConfigs:
    - name: "llm-default"
      provider: "openai_compatible"
      apiKey: "sk-xxx"
      baseUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      model: "qwen2.5-72b-instruct"

# ---------------------------------------------------------------------------
# semantic-grouper - Semantic grouping API + Celery worker
# ---------------------------------------------------------------------------
semanticGrouper:
  # -- Enable semantic-grouper deployment
  enabled: true
  image:
    repository: semantic-grouper
    tag: "v0.11.0-amd64"
  api:
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
  worker:
    replicas: 1
    # -- Number of Celery worker processes in each pod
    celeryWorkerAmount: "2"
    hierarchyMergeDebounceSeconds: "60"
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  config:
    # -- Redis DB index for Celery broker
    redisBrokerDb: "8"
    # -- Redis DB index for Celery result backend
    redisBackendDb: "9"
    # -- Redis DB index for distributed locks
    redisLockDb: "6"
    llm:
      provider: "openai_compatible"
      model: "deepseek-v3.2"
      temperature: "0.01"
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

# =============================================================================
# Agent Registry - A2A agent card discovery
# =============================================================================

# ---------------------------------------------------------------------------
# orchestrator-registry - Registry for orchestrator agent cards
# ---------------------------------------------------------------------------
orchestratorRegistry:
  enabled: true
  image:
    repository: agent-registry
    tag: "v0.11.0-amd64"
  replicas: 1
  config:
    # -- Vector collection name for agent cards
    collectionName: "orchestrator_agent_cards"
    # -- Redis DB index
    redisDb: "0"
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ---------------------------------------------------------------------------
# biz-orchestrator-registry - Registry for business orchestrator agent cards
# ---------------------------------------------------------------------------
bizOrchestratorRegistry:
  enabled: true
  image:
    repository: agent-registry
    tag: "v0.11.0-amd64"
  replicas: 1
  config:
    collectionName: "biz_orchestrator_agent_cards"
    redisDb: "2"
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# =============================================================================
# Agents - A2A protocol agents
# =============================================================================

# ---------------------------------------------------------------------------
# biz-routing-agent - Entry point: routes user queries to biz orchestrator agents
# ---------------------------------------------------------------------------
bizRoutingAgent:
  enabled: true
  image:
    repository: routing-agent
    tag: "v0.11.0-amd64"
  replicas: 1
  config:
    # -- Redis DB index for agent state
    redisDb: "2"
    # -- Agent card collection to search for orchestrators
    registryCollection: "biz_orchestrator_agent_cards"
    # -- Max retries for LLM routing calls
    maxRetries: "1"
  service:
    type: ClusterIP
    # -- A2A protocol port
    port: 10100
    targetPort: 10100
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# ---------------------------------------------------------------------------
# biz-chart-agent - ECharts generation agent (agent mode, self-registers)
# ---------------------------------------------------------------------------
bizChartAgent:
  enabled: true
  image:
    repository: chart-agent
    tag: "v0.11.0-amd64"
  replicas: 1
  config:
    redisDb: "2"
    agentName: "ChartAgent"
    agentDescription: "根据用户描述与数据判断是否可绘图并生成 ECharts 图表；数据不足时明确说明无法生成。"
    # -- Start mode (agent = self-register to biz registry)
    startMode: "agent"
    # -- Whether to self-register to agent registry
    registerAgent: "true"
  service:
    type: ClusterIP
    port: 10100
    targetPort: 10100
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# ---------------------------------------------------------------------------
# biz-skill-agent - Skill execution agent (self-registers to biz registry)
# ---------------------------------------------------------------------------
bizSkillAgent:
  enabled: true
  image:
    repository: skill-agent
    tag: "v0.11.0-amd64"
  replicas: 1
  config:
    # -- Redis DB index for agent state / registration
    redisDb: "2"
    # -- Agent card name registered to the biz registry
    agentName: "SkillAgent"
    # -- Whether to self-register to agent registry
    registerAgent: "true"
    # -- Max ReAct steps per plan_and_run invocation (env: LOCAL_SKILL_MAX_STEPS)
    maxSteps: "20"
    # -- plan_cmd subprocess timeout in seconds (env: LOCAL_SKILL_CMD_TIMEOUT_SEC)
    cmdTimeoutSec: "30"
    # -- Max in-process plan_cmd concurrency, "0" = unlimited (env: LOCAL_SKILL_MAX_CONCURRENCY)
    maxConcurrency: "8"
    # -- Skills to pull from skill-hub at startup (env: SKILLS). Names must
    #    match each zip's SKILL.md frontmatter `name`. Empty list = no download.
    skills:
      - weather
      - web_fetch
      - tavily-search
      - code_execution
      - extract_pdf
    # -- Override skill-hub base URL. Empty string uses the in-cluster skill-hub
    #    Service (see dac.skillHub.url).
    skillHubUrl: ""
    # -- Where the agent writes downloaded zips. Must match LOCAL_SKILLS_DIR so
    #    SkillRunner preload picks them up (env: SKILLS_DOWNLOAD_DIR).
    skillsDownloadDir: "/app/skills/"
    # -- Re-download even if the zip already exists locally (env: SKILL_DOWNLOAD_OVERWRITE)
    skillDownloadOverwrite: "true"
    # -- Parallel download worker count (env: SKILL_DOWNLOAD_CONCURRENCY)
    skillDownloadConcurrency: "8"
    # -- Per-request HTTP timeout in seconds. "" -> use module default (30).
    skillDownloadTimeout: ""
  service:
    type: ClusterIP
    # -- A2A protocol port
    port: 10100
    targetPort: 10100
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

# ---------------------------------------------------------------------------
# skill-hub - HTTP index/download service for skill zip packages.
# skill-agent (and orchestrator-agent's skill_download.py) fetches
# `{SKILL_HUB_URL}/skills/{name}.zip` from this service at startup.
# Uploaded / created skills are written under SKILLS_DIR; without persistence
# they live only in the container FS and are lost on pod restart.
# ---------------------------------------------------------------------------
skillHub:
  enabled: true
  image:
    repository: skill-hub
    tag: "v0.11.0-amd64"
  # hostPath persistence is node-local — keep replicas at 1.
  replicas: 1
  config:
    # -- Silence the transitive langfuse "client disabled" log from skill_sdk.
    #    Set to "true" only if a real langfuse instance is configured.
    langfuseEnabled: "false"
    # -- Override SKILLS_DIR when persistence.enabled=false. Empty = image
    #    default (/app/skills/). Ignored when persistence is enabled (mountPath
    #    is always used as SKILLS_DIR then).
    skillsDir: ""
  # Persist skill zips across pod restarts. Default hostPath is enough for
  # single-node / lab clusters; switch type to "pvc" for multi-node / prod.
  persistence:
    enabled: true
    # -- "hostPath" | "pvc"
    type: hostPath
    # -- Container mount path (= SKILLS_DIR when persistence is on)
    mountPath: /app/skills
    hostPath:
      # -- Node-local directory (kubelet creates it when type=DirectoryOrCreate)
      path: /var/lib/dac/skill-hub/skills
      type: DirectoryOrCreate
    pvc:
      # -- Reuse an existing PVC name; empty creates "{{ release }}-skill-hub-skills"
      existingClaim: ""
      storageClass: ""
      size: 5Gi
      accessMode: ReadWriteOnce
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# =============================================================================
# NOTE: orchestrator-agent, expert-agent, code-agent, doc-agent,
# dac-data-services and data-sinkers-job are NOT deployed statically by Helm.
# They are dynamically created by the execution-engine operator when
# DataAgentContainer / DataDescriptor CRs are applied.
# See executionEngine.agentImages above for image configuration.
# =============================================================================
